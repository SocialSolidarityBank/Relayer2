existing_patterns:
  - "append-only 표 + relayer_forbid_mutation 트리거, 마지막 행이 현재 상태"
  - "자유 글·전사·분석 본문은 encryptText 로 암호화 저장, 감사에는 action·id·필드 이름만"
  - "동의 게이트 assertConsent → 마스킹 maskAll → 외부 LLM → 초안 → 사람 승인 → 같은 트랜잭션에 ai_approved 카드"
  - "zod 로 본문 검증, 오류 클래스 → HTTP 매핑(routes.ts:90-115), 거절은 사람이 읽는 명사구"
  - "통합 테스트는 RELAYER_INTEGRATION=1 + 격리 DB 접두어, 외부 HTTP 는 fetch 스텁"
  - "화면 문구는 명사구·마침표 없음(DESIGN §6), 라벨 색 민트/AI 라벤더/경고 코랄/리스크 핑크"
  - "팝업은 Dialog size='wide' 2열, 편집은 Revisable + session_revisions, stale 은 배지 + 다시 하기"
  - "app.css 는 레인 구획 주석 안에만 추가, tokens 값 불변"

