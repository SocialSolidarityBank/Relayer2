goal: >-
  origin/main(d3c024f, 2026-09-18) 기준 한 레인이 현재 회차의 수기 원본(memo + 수기 카드 4종, 첫상담은 자유 글 항목)만을 근거로
  v6 규칙(01 시간순 계층·상태 띠, 02 핵심·변화 3하위·확인필요·완료·해결, 04 전사 전문 연결·불일치 4조건)으로
  단락 구조·상태·키워드(구조 데이터+LLM 추출)·전사 연결·요약을 한 초안으로 만들어 한 번 승인하게 하고 —
  목표(전체+회차)는 시간 모호 시 묶음 기준과 핵심 선별 1순위, 전사는 연결·대조만, 지난 회차·브리핑·나중 말 규칙은 버림 —
  원본 팝업 수기 열의 `원문 그대로|구조화` 토글, 전사 열의 띠·하이라이트·클릭 대조 4항목·불일치 필터,
  키워드 칩→같은 사례 전 회차 백링크 패널, 회차별 요약 4구역(빈 구역 숨김, DESIGN 현행 색·명사구·이모지 없음,
  자유 편집 시 근거 해제 표시)으로 그리며, relayer-testdata 발췌 골든케이스·LLM 스텁·브라우저 증거·원문 coverage·수동 1회로
  검증하고 SPEC/GLOSSARY/DESIGN을 같이 고친다(다중 녹음·사례 넘어 백링크·단일 HTML·자동 재처리·배포는 범위 밖).

