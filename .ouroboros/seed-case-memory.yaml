goal: >-
  RELAYER2 에 사례(support_case)당 1개의 '사례 기억'을 둔다 — 승인된(status=done) 회차 기록을 식별자 마스킹해
  외부 LLM 이 요약한, 근거 참조(회차·카드 id)를 든 암호화 저장 캐시 — AI 초안 생성(ai.ts draftSession)이
  지난 회차 전량 대신 이 기억만 입력으로 쓰게 하고, 회차 기록 저장·초안 승인 이벤트마다 백그라운드로 갱신하며,
  사례 삭제 cascade·외부 LLM 동의 철회·원본 회차 수정 시 지우고(다음 승인 때 재생성), 종결 후에는 동결한다.
  위키·백링크·하이라이트 화면은 만들지 않는다.

task_type: code

project_type: brownfield

metadata:
  version: "1.0.0"
  ambiguity_score: "n/a (Path B, no MCP)"
  interview: "Path B (no MCP) 2026-09-18, ledger in conversation; acceptance guard closer/contrarian/gap_hunter → not_ready → 4 decisions closed by Q (producer=external LLM, derived=rebuildable cache, fallback=regenerate-or-503, G1=stub contract test + manual checklist) → restate approved"

constraints:
  - "단위·소유: 기억은 support_cases 1행당 1행. 기본값: 표 `case_memories(case_id bigint primary key references support_cases(id) on delete cascade, enc_text text not null, through_seq int not null, refs jsonb not null, mask_hits jsonb not null, model text not null, created_by bigint references users(id), updated_at timestamptz not null default now())`, 본문은 자유 글(encryptText). 마이그레이션 `migrations/0030_case_memories.sql`(0027-0029 는 다른 레인이 쓴다). 덮어쓰기(upsert)이며 이력 표를 두지 않는다 — 감사 추적은 audit_log 의 생성 사건이 맡는다. 줄 번호 인용은 2026-09-18 main 기준이며 착수 시 재확인한다"
  - "파생물 정의: 기억은 언제든 그 사례의 status=done 회차 전체(sessionParts + maskAll)에서 다시 만들 수 있는 캐시다. 승인 없이 쓰며 화면에 보이지 않는다. 기록이 아니다(GLOSSARY §6-5 '사람이 승인해야 기록' 은 기억에 적용하지 않는다). 초안(ai_drafts)과 같은 '비공식' 지위"
  - "생성 경로: `api/src/ai.ts` 에 `refreshCaseMemory(caseId, actorId, trigger, {beforeSeq?})` 를 둔다. 순서 = support_cases.status='closed' 면 건너뜀(동결) → assertConsent(caseId,'external_llm_cross_border_processing') → done 회차(beforeSeq 앞까지)를 seq 순으로 sessionParts → maskAll(subject = 가명·금고 이름·연락처·이메일, 현 masking.ts 불변) → 모델 호출(초안과 같은 PROVIDER·MODEL·store:false 경로) → 응답 {text, refs} 검증 → upsert(through_seq = 접은 마지막 done seq; 잠금·단조 증가 없음 — 초안이 through_seq 정확 일치로 판별하므로 어느 스냅샷도 맞다) → audit 'ai.memory'(fields trigger=record_done|approve_draft|draft_request|edit, through_seq, recipient·country·model·store·masked:<kind>=n). 보낸 원문은 남기지 않는다. 기본값: refs 의 session_id·card_id 가 그 사례에 실재하지 않으면 실패로 본다. 기본값: 접을 회차가 0개면 행을 지운다"
  - "기억 내용: 식별자만 마스킹한다(현 masking.ts 그대로, 민감정보 내용은 남는다). 프롬프트는 SYSTEM 규칙(ai.ts:48-52 지어내지 않기·자리표 보존·판정 금지·기록체·숫자 보존)을 그대로 쓰고, 기억에 반드시 담을 것 = 전체 상담 목표·미완료 과제·약속·직전 회차까지의 사실관계 변화(fact_changes 와 같은 topic/before/after 꼴)·각 항목의 근거 회차 seq. 기본값: 본문 상한 4,000자(평문)를 프롬프트에 명시하고 초과 응답은 실패로 본다 — ponytail: 고정 상한, 회차가 수십 개로 늘어 상한이 부족하면 오래된 회차 압축 규칙을 추가한다"
  - "본문 암호화: enc_text 는 pii.ts encryptText 로 쓰고 decryptText 로 읽는다(memo·cards·goal 과 같은 규율). refs 는 id 만 담으므로 평문 jsonb"
  - "초안 입력 대체(구현 중 발견한 오염 규칙 반영): draftSession 의 '지난 회차 자료' 루프를 삭제하고 `---- 사례 기억 (사실관계 변화를 찾는 데만 쓴다) ----` + 기억 본문으로 바꾼다. 초안은 through_seq 가 **이번 회차 직전 done seq 와 정확히 같을 때만** 기억을 쓴다 — 뒤처졌든 이번 회차까지 접혔든 어긋나면 그 자리에서 refreshCaseMemory(trigger=draft_request, beforeSeq=이번 seq) 를 동기로 돌린 뒤 진행한다(이번 회차가 기억에 섞이면 사실관계 변화를 못 찾는다). 재생성이 실패하면 초안도 AiUnavailable(503) 로 정확히 실패한다 — 전량 전송 폴백 경로는 두지 않는다(유일 경로). 지난 done 회차가 없으면 기억 없이 진행한다. 이번 회차 자료(masked)는 지금처럼 그대로 보낸다"
  - "갱신 트리거(백그라운드, 크론 없음): routes 의 `PUT /cases/:id/intake`·`PATCH /sessions/:id` 응답 직전과 approveDraft 감사 뒤에 `refreshCaseMemoryInBackground(caseId, actorId, trigger, savedSessionId?)` 로 1회. 방금 저장한 회차가 마지막 done 회차면 그 앞까지만(beforeSeq) 접는다 — 그 회차의 초안이 바로 쓸 수 있게. 지난 회차 수정이면 전부 접는다. 동의·AI 없음은 한 줄 로그, 그 밖의 실패는 console.error 로 남기고 요청은 실패시키지 않는다(다음 초안 요청 때 재생성으로 회복). 시험은 `settleCaseMemory()` 로 마지막 갱신을 기다린다"
  - "원본 수정 무효화(Q 결정: 수정 시 지우고 다음 승인 때 재생성): 이미 done 인 회차를 다시 저장(수정)하면 **같은 트랜잭션 안에서 `delete from case_memories where case_id=…`** 로 먼저 지운다(삭제는 서버 로그만). 기본값: 그 저장도 '기록 저장' 이벤트이므로 커밋 뒤 같은 훅이 trigger=edit 으로 다시 만든다 — 즉시 재생성이 비용 문제면 훅을 빼고 다음 승인·초안 요청 때만 재생성해도 된다. 어느 쪽이든 훅이 실패하면 행이 없는 상태로 남아 다음 초안 요청이 재생성한다 — 옛 기억이 초안에 들어가는 창이 없다"
  - "삭제 규칙: (1) support_cases·participants 삭제는 FK cascade 로 자동. (2) routes.ts:405 의 철회 분기에 `external_llm_cross_border_processing` withdraw → `delete from case_memories where case_id=…` 를 더한다(음성 철회 규칙과 대칭, 감사 'ai.memory.withdraw'). sensitive_information_processing 철회는 기록과 같이 지우지 않는다(SPEC §14 '철회는 지움이 아니다'). (3) 글 기록 '종결 후 1년 파기' 스위프는 이 모듈 범위 밖 — 나중에 생기면 cascade 로 따라간다"
  - "종결 동결: support_cases.status='closed' 인 사례는 refreshCaseMemory 가 아무것도 하지 않는다(행 보존). 종결 사례의 초안 요청은 이미 409 이므로 초안 경로에서 재생성이 일어나지 않는다"
  - "감사: AUDIT_KINDS(audit.ts:22) 에 기본값: 'ai.memory'(kind '기록', label 'AI 사례 기억 갱신')·'ai.memory.withdraw'(kind '운영', label 'AI 사례 기억 삭제(동의 철회)') 를 등록한다. 미등록 action 은 버려진다(audit.ts:82-85)"
  - "근거 참조 계약(화면 없음): refs = [{session_id, seq, card_ids:number[]}] 만. 문단 단위 앵커·백링크·하이라이트 UI·위키 페이지는 만들지 않는다. GLOSSARY.md 에 '사례 기억' 항목 1개, 기본값: SPEC.md §15 에 15-6 '사례 기억' 절을 더한다(단위·생성·입력 대체·삭제·동결·비공식 지위)"
  - "AI 없어도 제품은 돈다: 키가 없거나 동의가 없으면 refreshCaseMemory 는 AiUnavailable/동의 오류로 끝나고 행을 만들지 않는다. 훅에서는 삼키고, 초안 경로에서는 503"
  - "레인 경계: web/ 는 고치지 않는다(새 화면·API 노출 없음). `.worktrees/DESIGN` 의 파일·CSS·토큰·DESIGN.md 를 건드리지 않는다. masking.ts 를 고치지 않는다"
  - "비범위: 위키·백링크·하이라이트·V6 정리 표기 UI, 새 질의응답 화면, 실무자 기억, 당사자 횡단 기억, 민감정보 범주 제외, 글 1년 파기 스위프, 기억 이력·버전 표, 로컬 결정론적 요약, 동시 갱신 잠금(정확 일치 판별로 충분)"

acceptance_criteria:
  - description: >-
      모델을 스텁한 단위 시험에서 (a) 기억 생성 프롬프트는 done 회차 전부를 마스킹한 자료만 담고 금고 원문(이름·연락처·이메일·주민번호)이 한 글자도 실리지 않으며,
      (b) 응답 refs 의 session_id·card_id 가 사례에 없는 값이면 실패하고, (c) 초안 프롬프트는 '---- 사례 기억' 블록과 이번 회차 자료만 담고 '[지난 회차' 블록이 없으며,
      (d) 기억 본문이 상한을 넘는 응답은 실패한다 (ai-outbound.test.ts 와 같은 방식으로 요청 본문을 가로채 검사)
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/case-memory.integration.test.ts --reporter=basic"
    expected_artifacts: ["api/src/ai.ts", "api/test/case-memory.integration.test.ts"]
    output_assertion: "NONE"
  - description: >-
      통합 시험에서 외부 LLM 동의가 없는 사례는 recordSession(done)·approveDraft 뒤에도 case_memories 행이 없고 모델 스텁이 호출되지 않으며,
      동의가 있는 사례는 done 저장 뒤 행이 생기고 through_seq 가 마지막 done seq 이며 audit_log 에 action='ai.memory' 행이 trigger·recipient·country·store·masked:<kind> 필드와 함께 남고,
      이미 done 인 회차를 수정 저장하면 그 트랜잭션 안에서 행이 지워지고 훅 성공 시 trigger=edit 으로 새 행이 생기며 훅 스텁이 실패하면 행이 0건으로 남고,
      종결 사례에서는 갱신이 일어나지 않고, external_llm 동의 withdraw 이벤트 뒤 행이 0건이며 audit_log 에 'ai.memory.withdraw' 가 남고, support_cases 삭제 뒤 행이 0건이다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/case-memory.integration.test.ts --reporter=basic"
    expected_artifacts: ["migrations/0030_case_memories.sql", "api/src/ai.ts", "api/src/service.ts", "api/src/routes.ts", "api/src/audit.ts", "api/test/case-memory.integration.test.ts"]
    output_assertion: "NONE"
  - description: >-
      전송량 검증(스텁 내용과 무관): 같은 통합 시험 파일 안에서 동의 있는 사례에 done 회차를 2개와 8개로 만든 뒤 각각 다음 회차 초안 요청 본문을 가로채 —
      두 경우 모두 '---- 사례 기억' 블록이 정확히 1개이고 그 블록이 4,000자 이하이며 '[지난 회차' 블록이 0개이고, 8회차 요청 본문 전체 길이 ≤ 2회차 요청 본문 길이 + 4,000자임을 수치로 단언하고,
      기억이 없거나 오래된 상태(through_seq 뒤처짐)에서 초안을 요청하면 먼저 재생성이 1회(trigger=draft_request) 일어나며,
      재생성 스텁이 실패하면 초안 요청이 503 으로 끝나고 ai_drafts 행이 생기지 않는다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/case-memory.integration.test.ts -t '전송량|재생성' --reporter=basic"
    expected_artifacts: ["api/test/case-memory.integration.test.ts"]
    output_assertion: "NONE"
  - description: >-
      기존 초안·승인·마스킹·감사 시험이 기억 입력 대체 뒤에도 통과하고 미적용 마이그레이션이 없다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/ai-approval.integration.test.ts test/ai-outbound.test.ts test/masking.test.ts test/audit.test.ts --reporter=basic && RELAYER_INTEGRATION=1 node api/src/migrate.ts --check"
    expected_artifacts: ["api/src/ai.ts", "migrations/0030_case_memories.sql"]
    output_assertion: "NONE"
  - description: >-
      배포 전 수동 검수 1회: 합성 사례 1건(done 회차 3개 이상)에서 실제 모델로 기억을 만들고 실무자가 체크리스트를 채운 기록이 남는다.
      체크리스트 문구는 정확히 '필수 항목 누락 0'(전체 목표·미완료 과제·약속·사실관계 변화), '자료에 없는 사실 0', '자리표 열림 0', 'refs 실재 확인' 네 줄이다
    verify_command: "grep -q '필수 항목 누락 0' docs/case-memory-review-2026-09.md && grep -q '자료에 없는 사실 0' docs/case-memory-review-2026-09.md && grep -q '자리표 열림 0' docs/case-memory-review-2026-09.md && grep -q 'refs 실재 확인' docs/case-memory-review-2026-09.md && echo REVIEW_OK"
    expected_artifacts: ["docs/case-memory-review-2026-09.md"]
    output_assertion: "REVIEW_OK"
  - description: >-
      SPEC.md §15 에 15-6 '사례 기억' 절(단위·생성 경로·초안 입력 대체·유일 경로/503·갱신 훅·삭제 3규칙·종결 동결·비공식 지위·근거 참조 계약)이 있고 GLOSSARY.md 에 '사례 기억' 항목이 있으며,
      ai.ts 의 '지난 회차 전부를 매번 보낸다' ponytail 주석이 사라졌다
    verify_command: "grep -q '사례 기억' SPEC.md && grep -q 'case_memories' SPEC.md && grep -q '사례 기억' GLOSSARY.md && ! grep -q '지난 회차 전부를 매번 보낸다' api/src/ai.ts && echo SPEC_OK"
    expected_artifacts: ["SPEC.md", "GLOSSARY.md"]
    output_assertion: "SPEC_OK"

ontology_schema:
  name: "RelayerCaseMemory"
  description: >-
    사례당 하나뿐인, 승인된 회차 전체에서 언제든 다시 만들 수 있는 마스킹·암호화 요약 캐시. 초안 생성의 유일한 과거 입력이며
    사례 삭제·동의 철회·원본 수정에 따라 사라지고 종결 뒤 얼어붙는다.
  fields:
    - name: case_id
      type: number
      description: "support_cases.id. PK 이자 cascade 축"
    - name: enc_text
      type: string
      description: "encryptText 로 감싼 기억 본문. 식별자 자리표만 있고 원문 없음. 상한 4,000자(평문 기준)"
    - name: through_seq
      type: number
      description: "접어 넣은 마지막 done 회차 seq. 초안은 이번 회차 직전 done seq 와 정확히 같을 때만 읽는다"
    - name: refs
      type: array
      description: "[{session_id, seq, card_ids[]}] — 근거 참조 데이터 계약. 화면 없음"
    - name: mask_hits
      type: object
      description: "종류별 마스킹 건수. 감사·검증용, 원문 없음"
    - name: model
      type: string
      description: "생성한 모델 이름(ai.ts MODEL)"
    - name: refresh_trigger
      type: string
      description: "표 컬럼이 아니다 — audit_log 'ai.memory' 의 trigger= 필드. record_done | approve_draft | draft_request | edit 넷 중 하나"

evaluation_principles:
  - name: privacy_boundary
    description: "금고 원문이 기억 본문·프롬프트·감사·로그 어디에도 없다. 동의 없이는 외부 호출이 없다"
    weight: 1.0
  - name: single_path
    description: "초안의 과거 입력은 기억뿐이다. 전량 전송 코드가 남아 있지 않고 실패는 503 으로 정확히 드러난다"
