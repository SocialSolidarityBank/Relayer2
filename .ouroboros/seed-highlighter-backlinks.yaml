goal: >-
  회차별 요약과 회차 원본 팝업에서 위험 신호·확인된 변화·수행할 과제·다음에 물어볼 것을
  같은 색 규칙과 필터로 읽고, 사람이 승인한 AI 정리에서 뽑은 키워드가 같은 당사자의 다른 회차·사례에
  나온 자리를 백링크로 연결한다. 원본 수정·권한 변경·AI 비활성 상태에서 틀린 강조나 다른 당사자 자료를 보여 주지 않는다.

task_type: code

project_type: brownfield

metadata:
  version: "0.1.0-draft"
  target_release: "post-v0.2.0"
  ambiguity_score: 0.14
  status: "design-only"

constraints:
  - "표시명은 GLOSSARY 정본을 따른다. 요약은 위험 신호·확인된 변화, 작성 원본은 수행할 과제·다음에 물어볼 것, 읽기 표면은 확인할 과제·오늘 물어볼 것을 쓴다"
  - "신호 종류 식별자는 risk|change|task|question 네 값이다. 표시명 변경이 식별자를 바꾸지 않는다"
  - "색 규칙: risk=코랄, change=민트, task=라벤더, question=블루다. 색만으로 구분하지 않고 필터 이름·aria-label·밑줄 모양을 함께 둔다. AI 출처는 별도 AI 배지로 말한다"
  - "요약 필터는 전체·위험 신호·확인된 변화·확인할 과제·오늘 물어볼 것 다섯 알약이며, 선택은 현재 화면 상태일 뿐 URL·DB에 저장하지 않는다"
  - "회차 원본 팝업은 현재 두 열 구조를 유지한다. 강조는 텍스트 위 mark span으로만 그리고 원문을 수정·복제하지 않는다. 필터를 꺼도 원문은 사라지지 않고 강조 면만 사라진다"
  - "signal_index는 승인된 AI 정리 또는 명시적 다시 만들기에서만 새 버전을 append-only로 쌓는다. 승인 전 AI 초안은 회차별 요약·백링크에 나오지 않는다"
  - "AI가 꺼졌거나 external_llm_cross_border_processing 동의가 없으면 외부 호출을 하지 않는다. 기존 card·risk·fact_change 구조로 알 수 있는 신호 색은 보여 줄 수 있지만 새 키워드 백링크는 만들지 않는다"
  - "원본·전사·요약마다 source_kind, source_record_id, source_fingerprint(HMAC), UTF-16 start/end를 저장한다. 현재 본문의 fingerprint가 다르면 그 index의 span과 백링크를 렌더하지 않고 재정리 필요 상태로 둔다"
  - "keyword_mentions는 키워드 평문과 문맥 조각을 encryptText로 암호화한다. 비교키는 PII_ENC_KEY에서 HKDF로 분리한 키로 HMAC(participant_id + NUL + NFKC 정규화 키워드)하여 다른 당사자 사이의 같은 단어도 연결할 수 없게 한다"
  - "키워드 정규화는 Unicode NFKC, 앞뒤 공백 제거, 연속 공백 하나, ASCII 영문 소문자화만 한다. 조사 제거·어간 추출·동의어 확장은 하지 않는다. 다른 말을 같은 사실로 합치지 않는다"
  - "백링크 범위는 같은 participants.id 안이다. 여러 support_cases를 가질 수 있지만 요청자는 각 case_assignments 접근을 따로 통과한 회차만 받는다. 관리자도 배정되지 않은 사례의 존재·건수·키워드를 보지 못한다"
  - "백링크 응답은 현재 키워드, 회차 번호, 날짜, 참여 사업, 표면 종류, 짧은 복호화 문맥, 이동 target만 돌려준다. PII·전체 원문·접근 불가 결과의 개수는 돌려주지 않는다"
  - "POST /sessions/:id/signal-index/rebuild는 비용·동의 게이트 때문에 사람이 눌러야 한다. 원본 수정 뒤 자동 재처리하지 않는 SPEC §17-4 규칙을 유지한다"
  - "LLM 요청은 store:false, 마스킹, 현재 배포의 승인된 provider를 사용한다. 프롬프트·응답·감사에 원문을 남기지 않고 모델·생성 시각·신호/키워드 건수만 남긴다"
  - "범위 밖: 기관 전체 검색, 다른 당사자 추천, 자동 진단·위험 판정, 지식 그래프 시각화, 동의어 사전, 벡터 DB, embeddings, 원본 자동 수정, 승인 전 AI 결과 공개"

acceptance_criteria:
  - description: >-
      회차별 요약과 원본 팝업이 risk·change·task·question을 정해진 색·이름·aria-label로 표시하고,
      각 필터가 해당 강조만 바꾸며 원문과 다른 종류의 내용은 숨기지 않는다
    verify_command: "pnpm --dir web exec playwright test e2e/highlighter.spec.ts --reporter=line"
    expected_artifacts: ["web/e2e/highlighter.spec.ts", "web/src/screens/participant-info.tsx", "web/src/session-original.tsx"]
    output_assertion: "NONE"
  - description: >-
      승인된 AI 정리에서 만든 signal_index가 UTF-16 범위와 현재 source fingerprint가 맞을 때만 렌더되고,
      수기·전사·요약 리비전 뒤에는 옛 span이 나오지 않으며 다시 만들기 뒤 새 버전만 현재가 된다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/signal-index.integration.test.ts --reporter=basic"
    expected_artifacts: ["migrations/00xx_signal_index.sql", "api/src/signal-index.ts", "api/test/signal-index.integration.test.ts"]
    output_assertion: "NONE"
  - description: >-
      같은 당사자의 같은 정규화 키워드는 접근 가능한 여러 회차·사례에 백링크되지만,
      다른 당사자의 같은 단어와 배정되지 않은 사례는 결과·건수 모두 노출되지 않는다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/backlinks-access.integration.test.ts --reporter=basic"
    expected_artifacts: ["api/test/backlinks-access.integration.test.ts", "api/src/access.ts"]
    output_assertion: "NONE"
  - description: >-
      DB의 keyword_mentions와 signal span 문맥에 평문 키워드·문장이 없고 비교키는 당사자마다 달라지며,
      API·감사·오류 로그에 원문·HMAC·암호문이 없다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/backlinks-encryption.integration.test.ts --reporter=basic && ./scripts/check-encryption.sh"
    expected_artifacts: ["api/test/backlinks-encryption.integration.test.ts", "api/src/crypto-keywords.ts"]
    output_assertion: "NONE"
  - description: >-
      AI 연결 또는 외부 LLM 동의가 없으면 다시 만들기가 409로 막히고 외부 fetch가 0회이며,
      이미 있는 구조화 카드 신호 필터와 원본 읽기는 계속 동작한다
    verify_command: "pnpm --dir api exec vitest run test/signal-index-gates.test.ts --reporter=basic"
    expected_artifacts: ["api/test/signal-index-gates.test.ts"]
    output_assertion: "NONE"
  - description: >-
      설계 문서가 네 신호 색·필터·암호화 인덱스·source fingerprint·같은 당사자 접근 범위·API·화면·재정리 규칙을 명시한다
    verify_command: "ruby -e 'require %q{yaml}; YAML.load_file(ARGV[0]); s=File.read(%q{SPEC.md}); abort unless s.include?(%q{## 27. 하이라이터·백링크}); puts %q{DESIGN_OK highlighter-backlinks}' .ouroboros/seed-highlighter-backlinks.yaml"
    expected_artifacts: [".ouroboros/seed-highlighter-backlinks.yaml", "SPEC.md"]
    output_assertion: "DESIGN_OK highlighter-backlinks"

ontology_schema:
  name: "RelayerSignalIndex"
  description: >-
    승인된 기록에서 신호 span과 키워드 mention을 버전으로 만들고, 현재 원본과 접근 권한이 맞는 것만
    같은 당사자 안에서 읽기 탐색으로 연결하는 파생 인덱스.
  fields:
    - name: "signal_index"
      type: "object"
      description: "session_id·source_kind·source_record_id·source_fingerprint·model·created_at을 가진 append-only 버전"
    - name: "signal_span"
      type: "object"
      description: "risk|change|task|question, UTF-16 start/end, 암호화 문맥. 현재 source와 맞을 때만 표시"
    - name: "keyword_mention"
      type: "object"
      description: "participant_id·기관 내 HMAC 비교키·암호화 표시어·암호화 문맥·source span"
    - name: "backlink"
      type: "object"
      description: "같은 participant_id와 keyword HMAC를 공유하고 요청자가 접근할 수 있는 다른 mention으로 가는 읽기 링크"
    - name: "source_fingerprint"
      type: "string"
      description: "원문 평문이 바뀌었는지 확인하는 key-separated HMAC. API에 노출하지 않음"
    - name: "signal_filter"
      type: "ui_state"
      description: "전체 또는 네 신호 종류. 영속화하지 않는 현재 화면 상태"

evaluation_principles:
  - name: "원문을 지키는 강조"
    description: "강조와 필터는 원문을 바꾸거나 숨기지 않고 읽는 층으로만 선다"
    weight: 1.0
  - name: "같은 당사자만"
    description: "키워드가 같아도 다른 당사자·무권한 사례의 존재를 연결하지 않는다"
    weight: 1.0
  - name: "틀린 링크보다 빈 링크"
    description: "원본이 바뀌거나 위치가 모호하면 옛 span을 억지로 옮기지 않고 재정리 필요로 둔다"
    weight: 1.0
  - name: "AI 없이 읽기 유지"
    description: "백링크 생성이 막혀도 기존 기록·구조화 신호·필터는 읽을 수 있다"
    weight: 0.9

exit_conditions:
  - name: "신호 표면"
    description: "두 화면에서 같은 네 신호 규칙과 필터가 동작한다"
    criteria: "highlighter E2E가 통과하고 1280·390 폭에서 원문을 가리지 않는다"
  - name: "백링크 격리"
    description: "같은 당사자·접근 가능한 사례만 연결된다"
    criteria: "backlinks-access와 backlinks-encryption 통합 테스트가 통과한다"
  - name: "리비전 안전"
    description: "원본 수정 뒤 옛 강조가 나오지 않는다"
    criteria: "signal-index 통합 테스트가 수정 전 표시·수정 후 숨김·재생성 후 표시를 증명한다"

context_references:
  - path: "GLOSSARY.md"
    role: "primary"
    summary: "위험 신호·확인된 변화·과제·질문의 표면별 표시명"
  - path: "SPEC.md"
    role: "primary"
    summary: "§2 카드, §15 AI 승인, §17-4 리비전·재정리, §27 이 설계 초안"
  - path: "web/src/screens/participant-info.tsx"
    role: "primary"
    summary: "회차별 요약 네 구역과 기존 risk·changes·task·question 조립"
  - path: "web/src/session-original.tsx"
    role: "primary"
    summary: "수기·녹음 전사 두 열 원본 팝업"
  - path: "migrations/0010_ai_drafts.sql"
    role: "reference"
    summary: "AI 초안·승인 append-only 패턴"
  - path: "migrations/0027_ui_plan_api.sql"
    role: "reference"
    summary: "session_revisions append-only와 원본 수정 패턴"
  - path: "api/src/access.ts"
    role: "primary"
    summary: "case_assignments 접근 seam. 백링크 결과마다 적용"
  - path: "api/src/ai.ts"
    role: "primary"
    summary: "store:false·마스킹·승인된 AI 정리 생성 경로"

existing_patterns:
  - "승인 전 AI 결과는 공식 기록도 회차별 요약도 아니다"
  - "원본 수정 뒤 자동 재처리하지 않고 재정리 필요를 표시한다"
  - "자유 글은 encryptText, 비교가 필요하면 key-separated HMAC만 저장한다"
  - "관리자도 case_assignments가 없는 상담 자료는 읽지 못한다"

existing_dependencies:
  - "postgres"
  - "hono"
  - "zod"
  - "react"
  - "OpenAI Responses API"
