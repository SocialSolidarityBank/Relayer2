goal: >-
  기관 가입을 시작할 때 배포 단위 주소를 먼저 확정하고, 1단계에서는 기관마다 독립 배포·DB 스키마·비밀값을 둔
  <slug>.relayer.kr 주소를 제공한다. 오늘은 빈 기관 test2 스테이징을 Azure Container Apps(koreacentral)에
  올릴 수 있는 실행 계약을 고정하고, 이후 한 배포 안에서 org_id와 PostgreSQL RLS로 여러 기관을 격리하는
  2단계 이행 경로를 데이터 손실 없이 준비한다.

task_type: code

project_type: brownfield

metadata:
  version: "0.1.0-draft"
  target_release: "v0.2.0+"
  ambiguity_score: 0.12
  status: "design-only"

constraints:
  - "정본: 표시명은 GLOSSARY.md, 현행 동작은 SPEC.md §24, 배포 기준은 docs/deploy.md·docs/azure-migration.md를 따른다"
  - "1단계 테넌시: 배포 하나 = 기관 하나다. 앱 프로세스·PostgreSQL 스키마·PII_ENC_KEY·SESSION_SECRET·Blob 접두 또는 컨테이너를 기관마다 가르고 Host 값으로 기관을 선택하지 않는다"
  - "주소 규칙: slug는 ASCII 소문자·숫자·하이픈만, 3~20자, 첫 글자와 끝 글자는 소문자 또는 숫자다. 정규식은 ^[a-z0-9](?:[a-z0-9-]{1,18}[a-z0-9])$ 이다"
  - "예약어: www, api, app, admin, auth, login, signup, static, assets, cdn, docs, help, status, health, test, staging, dev, preview, mail, support, relayer는 거절한다. 오늘 스테이징 주소 test2는 예약하지 않고 운영자가 선점한다"
  - "기본 주소는 https://<slug>.relayer.kr 이다. 서브디렉터리 대안 https://relayer.kr/<slug>는 base path·정적 자산·API·쿠키 경로를 함께 바꿔야 하므로 1단계 구현 범위 밖이며 비교안으로만 남긴다"
  - "RELAYER_SLUG와 RELAYER_PUBLIC_URL은 배포 설정이며 화면에서는 읽기 전용이다. 가입 폼이 DNS를 만들거나 사용 가능 여부를 추정하지 않는다"
  - "test2 스테이징은 ghcr.io/socialsolidaritybank/relayer2:v0.2.0 이미지를 사용하고 Azure Container Apps koreacentral의 relayer2-env 안에 relayer2-test2 앱으로 둔다"
  - "test2 스테이징은 PGSCHEMA=relayer_test2를 사용하고 seed.ts를 실행하지 않는다. /auth/signup이 open:true이고 workspace:null인 빈 기관이어야 한다"
  - "test2의 AI·녹음 글로 옮기기는 자격증명을 주입하지 않고 VOICE_ENABLED=0으로 둔다. 데이터베이스는 앱 부팅에 필요한 기반 연결만 주입하며 기관 설정 마법사의 외부 연결은 기본 꺼짐 상태다"
  - "비밀값 정본은 Infisical prod:/RELAYER2다. test2 값은 그 아래 분리 경로에 두고 값·지문·접속 문자열을 문서·로그·argv·PR에 싣지 않는다"
  - "2단계 다기관은 organizations 복수 행과 모든 기관 소유 표의 org_id NOT NULL FK, 복합 유일 제약, 요청별 SET LOCAL app.org_id, RLS를 한 번에 도입한다. 일부 표만 org_id를 갖는 중간 상태로 서비스를 열지 않는다"
  - "RLS는 관리자 역할도 우회하지 않는다. 사례 접근은 org_id 격리를 먼저 통과한 뒤 기존 case_assignments 규칙을 적용한다"
  - "2단계 이행은 기존 단일 기관을 한 organizations 행으로 백필하고 검증한 뒤 NOT NULL·RLS를 켠다. 역이행용 덤프와 행 수·외래키·암호문 복호화 검증 없이는 전환하지 않는다"
  - "범위 밖: 공용 계정 디렉터리, 기관 검색, 기관 전환기, 자동 과금, 앱 안 DNS 변경, 데이터 병합, 운영 relayer.kr 또는 ~/services/relayer2 수정"

acceptance_criteria:
  - description: >-
      slug 검증이 길이·문자·앞뒤 하이픈·예약어를 거절하고 test2·abc·a1-b2를 허용하며,
      가입과 배포 등록이 같은 검증 함수를 사용한다
    verify_command: "pnpm --dir api exec vitest run test/slug.test.ts --reporter=basic"
    expected_artifacts: ["api/src/domain/slug.ts", "api/test/slug.test.ts"]
    output_assertion: "NONE"
  - description: >-
      seed 없는 격리 DB에서 첫 관리자 가입 전 주소 test2가 읽기 전용으로 보이고 가입 뒤에도 바뀌지 않으며,
      다른 slug나 Host 헤더로 같은 배포의 기관이 바뀌지 않는다
    verify_command: "pnpm --dir web exec playwright test e2e/institution-address.spec.ts --reporter=line"
    expected_artifacts: ["web/e2e/institution-address.spec.ts", "web/src/screens/signup.tsx", "web/src/screens/onboarding.tsx"]
    output_assertion: "NONE"
  - description: >-
      test2 스테이징이 Azure Container Apps에서 v0.2.0 GHCR 이미지로 뜨고 /health가 성공하며,
      /auth/signup은 open:true·workspace:null이고 relayer_test2 스키마에는 시드 계정·합성 사례가 없다
    verify_command: >-
      curl -fsS https://test2.relayer.kr/health >/dev/null &&
      curl -fsS https://test2.relayer.kr/auth/signup | jq -e '.open == true and .workspace == null' >/dev/null
    verify_exemption_reason: "Azure·Cloudflare·Infisical 권한이 필요한 배포 관문이다. M3가 SPEC.md §25-4 명령을 실행하고 PR에 비밀값 없는 출력만 남긴다"
    expected_artifacts: ["SPEC.md", "docs/deploy.md"]
    output_assertion: "NONE"
  - description: >-
      2단계 마이그레이션 연습에서 모든 기관 소유 행에 org_id가 채워지고 누락·고아 행이 0이며,
      RLS 컨텍스트가 다른 기관에서는 같은 id의 행도 조회·수정할 수 없다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/multi-org-rls.integration.test.ts --reporter=basic"
    expected_artifacts: ["migrations/00xx_multi_org.sql", "api/test/multi-org-rls.integration.test.ts"]
    output_assertion: "NONE"
  - description: >-
      설계 문서가 1단계 배포 단위·서브도메인 기본·서브디렉터리 대안·slug 규칙·예약어·test2 실행 명령과
      2단계 org_id+RLS 이행·롤백을 모두 명시한다
    verify_command: "ruby -e 'require %q{yaml}; YAML.load_file(ARGV[0]); s=File.read(%q{SPEC.md}); abort unless s.include?(%q{## 25. 기관 주소·다기관 이행}); puts %q{DESIGN_OK institution-addressing}' .ouroboros/seed-institution-addressing.yaml"
    expected_artifacts: [".ouroboros/seed-institution-addressing.yaml", "SPEC.md"]
    output_assertion: "DESIGN_OK institution-addressing"

ontology_schema:
  name: "RelayerInstitutionAddressing"
  description: >-
    1단계에는 주소 하나가 독립 배포 하나를 가리키고, 2단계에는 주소가 organizations 행을 가리키되
    org_id와 RLS가 모든 기관 자료를 격리하는 모델.
  fields:
    - name: "deployment"
      type: "object"
      description: "1단계 기관 격리 단위. ACA 앱·DB 스키마·암호화 키·파일 저장 접두를 소유한다"
    - name: "slug"
      type: "string"
      description: "기관 주소 조각. 3~20자 ASCII 소문자·숫자·하이픈, 예약어 제외, 배포 설정에서 읽기 전용"
    - name: "public_address"
      type: "url"
      description: "기본 https://<slug>.relayer.kr. 화면 라벨은 주소"
    - name: "organization"
      type: "object"
      description: "1단계는 배포 안 단일 행, 2단계는 org_id를 가진 복수 기관 행"
    - name: "tenant_context"
      type: "object"
      description: "2단계 요청에서 인증된 소속을 SET LOCAL app.org_id로 DB 트랜잭션에 전달하는 값"
    - name: "rls_policy"
      type: "object"
      description: "현재 org_id 행만 SELECT·INSERT·UPDATE·DELETE하게 하는 PostgreSQL 정책"
    - name: "staging_clone"
      type: "object"
      description: "test2.relayer.kr, ACA relayer2-test2, PGSCHEMA relayer_test2, seed 없는 빈 기관"

evaluation_principles:
  - name: "격리가 먼저"
    description: "1단계는 배포로, 2단계는 org_id와 RLS로 다른 기관 자료가 같은 요청에 섞이지 않게 한다"
    weight: 1.0
  - name: "주소는 식별자"
    description: "slug를 기관명이나 DNS 성공 여부와 혼동하지 않고 변경을 배포 절차로 제한한다"
    weight: 0.9
  - name: "부분 이행 금지"
    description: "org_id 백필·제약·RLS·요청 컨텍스트를 한 관문으로 전환한다"
    weight: 1.0
  - name: "외부 포크 가능"
    description: "GitHub 소스와 GHCR 이미지, 표준 Postgres·DNS·ACA 명령만으로 기관 배포를 재현할 수 있다"
    weight: 0.9

exit_conditions:
  - name: "1단계 주소 계약"
    description: "slug 규칙과 배포 단위가 자동 검증된다"
    criteria: "slug 단위 테스트와 institution-address E2E 종료 코드가 0이다"
  - name: "test2 스테이징"
    description: "빈 기관 복제본이 별도 스키마로 열린다"
    criteria: "test2 /health 성공, /auth/signup open:true·workspace:null, seed 자료 0건 증거가 있다"
  - name: "2단계 이행 연습"
    description: "org_id 백필과 RLS가 교차 기관 접근을 막는다"
    criteria: "multi-org-rls 통합 테스트가 통과하고 이행 전후 행 수가 같다"

context_references:
  - path: "GLOSSARY.md"
    role: "primary"
    summary: "기관·배포기관·기관 워크스페이스·주소 표시명 정본"
  - path: "SPEC.md"
    role: "primary"
    summary: "§24 현행 단일 기관 가입·마법사 계약, §25 이 설계 초안"
  - path: "docs/deploy.md"
    role: "primary"
    summary: "현행 RELAYER_SLUG·서브도메인·새 DB 첫 가입 절차"
  - path: "docs/azure-migration.md"
    role: "primary"
    summary: "ACA koreacentral·GHCR·Blob 이전 기준"
  - path: "api/src/db.ts"
    role: "primary"
    summary: "PGSCHEMA search_path로 배포별 스키마를 가르는 현행 seam"
  - path: "api/src/migrate.ts"
    role: "primary"
    summary: "PGSCHEMA가 있으면 스키마를 만들고 그 안에 마이그레이션을 적용"
  - path: "migrations/0016_settings.sql"
    role: "reference"
    summary: "현행 organization 단일 행과 다기관을 미룬 이유"

existing_patterns:
  - "표시명과 식별자를 가른다. 주소 라벨이 바뀌어도 slug·org_id를 임의로 바꾸지 않는다"
  - "시험은 운영 Supabase가 아니라 일회용 DB 또는 별도 스키마만 쓴다"
  - "관리자도 배정 없이는 상담 자료를 못 본다. 다기관에서도 org 격리가 그 규칙보다 먼저다"
  - "삭제 대신 시각 컬럼과 이행 영수증을 남긴다"

existing_dependencies:
  - "postgres"
  - "hono"
  - "zod"
  - "Azure Container Apps"
  - "GitHub Container Registry"
  - "Cloudflare Tunnel"
