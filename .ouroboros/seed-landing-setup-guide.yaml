goal: >-
  로그인 화면이 곧 랜딩인 현행 구조를 유지하면서, 로그인 전에 `설정 가이드` 팝업을 열어
  새 기관 관리자에게 주소 확인 → 첫 관리자 가입 → 기관 워크스페이스 설정 → 외부 서비스 연결 → 실무자 초대 순서를,
  초대받은 실무자에게는 초대 링크 또는 기존 계정 로그인을 안내한다. 비밀값·내부 상태·기관 상담 자료는 노출하지 않는다.

task_type: code

project_type: brownfield

metadata:
  version: "0.1.0-draft"
  target_release: "post-v0.2.0"
  ambiguity_score: 0.08
  status: "design-only"

constraints:
  - "로그인 화면이 곧 랜딩이라는 SPEC.md §24-1 계약을 유지한다. 별도 마케팅 홈·대시보드·라우트를 만들지 않는다"
  - "진입은 로그인 카드 아래의 `설정 가이드` 알약 하나다. `가입하기`와 로그인 입력·버튼의 우선순위를 밀어내지 않는다"
  - "팝업 제목은 `릴레이어 설정 가이드`다. 네이티브 Dialog 부품을 재사용하고 새 모달 구현을 만들지 않는다"
  - "본문은 두 구획뿐이다: 새 기관 시작, 초대받은 실무자. 탭·슬라이드·진행 상태를 만들지 않고 한 번에 읽는 순서 목록으로 둔다"
  - "새 기관 시작 순서: 1 주소 확인, 2 가입하기로 첫 관리자 계정, 3 기관 워크스페이스 설정, 4 외부 서비스 연결(기본 꺼짐), 5 실무자 초대"
  - "초대받은 실무자 순서: 1 받은 초대 링크 열기, 2 계정 만들기 또는 로그인, 3 기관 준비 중이면 다시 확인하기, 4 상담 일정으로 이동하기"
  - "주소는 배포자가 정한 읽기 전용 값이라고 말한다. 팝업에서 slug 입력·DNS 생성·사용 가능 여부 확인을 제공하지 않는다"
  - "외부 서비스 이름은 AI 정리·녹음 글로 옮기기·데이터베이스다. 키 발급·결제·환경 변수 이름·접속 문자열·CLI 명령은 이 공개 팝업에 싣지 않는다"
  - "가입하기 CTA는 기존 #/signup으로만 간다. 가입 문이 닫힌 기관에서는 기존 초대 전용 안내가 판정하며, 팝업이 open 상태를 별도로 추정하지 않는다"
  - "설정 가이드는 정적 공개 문구다. 새 API·DB 컬럼·localStorage·쿠키·분석 이벤트를 만들지 않는다"
  - "팝업은 Escape·백드롭·닫기로 닫히고 열었던 `설정 가이드` 버튼으로 초점을 돌린다. 제목·순서 목록·외부 링크는 키보드와 스크린리더로 읽힌다"
  - "390px에서 팝업이 뷰포트 안에 있고 본문만 세로 스크롤되며, 로그인 입력과 오류는 팝업을 닫은 뒤 그대로 남는다"
  - "DESIGN.md §6에 따라 바깥 화면 문구는 명사구·한 줄을 유지한다. 팝업 본문은 절차 문서이므로 짧은 완전문을 허용하되 느낌표·시간 약속·감정어를 쓰지 않는다"
  - "범위 밖: 로그인 재설계, 비밀번호 찾기, 이메일 발송, 인앱 지원 채팅, 설치 자동화, 기관 검색·전환, 제공자별 비밀값 설정 가이드, 사용 추적"

acceptance_criteria:
  - description: >-
      로그아웃 상태의 /·#/login·보호 주소에서 같은 로그인 화면에 설정 가이드 버튼이 있고,
      열면 두 구획과 확정 순서가 보이며 닫은 뒤 아이디·비밀번호·오류 상태가 보존된다
    verify_command: "pnpm --dir web exec playwright test e2e/landing-setup-guide.spec.ts --reporter=line"
    expected_artifacts: ["web/e2e/landing-setup-guide.spec.ts", "web/src/screens/login.tsx", "web/src/setup-guide.tsx"]
    output_assertion: "NONE"
  - description: >-
      팝업에서 가입하기는 #/signup으로 가고 닫힌 가입 문에서는 기존 초대 전용 안내가 나오며,
      설정 가이드 자체는 /auth/signup 외 새 공개 API를 호출하지 않는다
    verify_command: "pnpm --dir web exec playwright test e2e/landing-setup-guide.spec.ts --grep '가입 문' --reporter=line"
    expected_artifacts: ["web/e2e/landing-setup-guide.spec.ts"]
    output_assertion: "NONE"
  - description: >-
      키보드만으로 열기·본문 링크·닫기·초점 복귀가 되고 390px에서 가로 넘침 없이 팝업 안에서만 세로 스크롤된다
    verify_command: "pnpm --dir web exec playwright test e2e/landing-setup-guide.spec.ts --grep '접근성과 390px' --reporter=line"
    expected_artifacts: ["web/e2e/landing-setup-guide.spec.ts", "web/src/styles/app.css"]
    output_assertion: "NONE"
  - description: >-
      공개 팝업과 번들에 비밀값·환경 변수 이름·실제 기관 연결 상태·상담 자료가 포함되지 않는다
    verify_command: "pnpm --dir web build && node scripts/check-setup-guide-bundle.mjs web/dist"
    expected_artifacts: ["scripts/check-setup-guide-bundle.mjs", "web/src/setup-guide.tsx"]
    output_assertion: "NONE"
  - description: >-
      HANDOFF-DESIGN의 타입·빌드·카드 실측·단일 worker E2E·일회용 DB 마이그레이션 검사가 모두 통과한다
    verify_command: "pnpm --dir web exec tsc --noEmit && pnpm --dir web build && node scripts/measure-cards.mjs http://localhost:8798 test2 && PLAYWRIGHT_BASE_URL=http://localhost:8798 PLAYWRIGHT_API_PREFIX= VOICE_ENABLED=1 pnpm --dir web exec playwright test --workers=1 && node --env-file=.env.design api/src/migrate.ts --check"
    verify_exemption_reason: "measure-cards와 전체 E2E는 HANDOFF-DESIGN.md의 일회용 relayer_design 서버가 떠 있어야 한다"
    expected_artifacts: ["HANDOFF-DESIGN.md"]
    output_assertion: "NONE"
  - description: >-
      설계 문서가 입구·두 대상·정확한 순서·공개 정보 경계·접근성·범위 밖을 명시한다
    verify_command: "ruby -e 'require %q{yaml}; YAML.load_file(ARGV[0]); s=File.read(%q{SPEC.md}); abort unless s.include?(%q{## 28. 랜딩 설정 가이드 팝업}); puts %q{DESIGN_OK landing-setup-guide}' .ouroboros/seed-landing-setup-guide.yaml"
    expected_artifacts: [".ouroboros/seed-landing-setup-guide.yaml", "SPEC.md"]
    output_assertion: "DESIGN_OK landing-setup-guide"

ontology_schema:
  name: "RelayerLandingSetupGuide"
  description: >-
    로그인 전에 제품 설치 상태를 바꾸지 않고, 새 기관 관리자와 초대받은 실무자가 자기 다음 행동을 찾게 하는 공개 안내 표면.
  fields:
    - name: "guide_trigger"
      type: "ui_action"
      description: "로그인 카드 아래 설정 가이드 알약. 로그인·가입보다 보조"
    - name: "new_institution_path"
      type: "ordered_steps"
      description: "주소 확인→첫 관리자 가입→기관 설정→외부 서비스 연결→실무자 초대"
    - name: "invited_worker_path"
      type: "ordered_steps"
      description: "초대 링크→계정 또는 로그인→준비 확인→상담 일정"
    - name: "public_information_boundary"
      type: "invariant"
      description: "표시명·순서·공개 주소 설명만. 비밀값·연결 상태·상담 자료 없음"

evaluation_principles:
  - name: "문은 하나"
    description: "랜딩과 로그인을 가르지 않고 현재 로그인 화면에서 필요한 안내만 연다"
    weight: 1.0
  - name: "대상은 둘"
    description: "새 기관 관리자와 초대받은 실무자의 서로 다른 다음 행동을 섞지 않는다"
    weight: 0.9
  - name: "공개 표면 최소"
    description: "로그인 전에는 설정 순서만 말하고 내부 상태·비밀값·상담 자료를 내놓지 않는다"
    weight: 1.0
  - name: "상태를 만들지 않는다"
    description: "읽었는지 저장하거나 진행률을 추가하지 않는 정적 가이드다"
    weight: 0.8

exit_conditions:
  - name: "랜딩 흐름"
    description: "설정 가이드가 기존 로그인·가입·깊은 주소 복귀를 깨지 않는다"
    criteria: "landing-setup-guide E2E와 기존 onboarding E2E가 통과한다"
  - name: "공개 정보 경계"
    description: "비밀값과 기관 내부 상태가 없다"
    criteria: "setup-guide 단위 검사와 빌드 산출물 검사에서 금지 문자열·동적 상태가 0건이다"
  - name: "디자인 관문"
    description: "실제 로그인 화면에서 카드·한 줄·모바일 검증을 통과한다"
    criteria: "HANDOFF-DESIGN 네 검사의 종료 코드가 0이다"

context_references:
  - path: "GLOSSARY.md"
    role: "primary"
    summary: "기관 워크스페이스·설정하기·외부 서비스 연결·상담 일정 표시명"
  - path: "SPEC.md"
    role: "primary"
    summary: "§24-1 로그인=랜딩·가입 문, §24-2 마법사, §28 이 설계 초안"
  - path: "web/src/screens/login.tsx"
    role: "primary"
    summary: "현재 preview-gate 로그인 카드와 가입하기 보조 링크"
  - path: "web/src/dialog.tsx"
    role: "primary"
    summary: "Escape·백드롭·초점 복귀를 가진 공용 Dialog"
  - path: "web/src/screens/settings.tsx"
    role: "reference"
    summary: "외부 서비스 설정 가이드 팝업의 기존 순서 목록 패턴"
  - path: "HANDOFF-DESIGN.md"
    role: "primary"
    summary: "PR 전 네 검증과 일회용 relayer_design 환경"

existing_patterns:
  - "로그인 화면이 곧 랜딩이며 가입하기 노출과 가입 허용은 별개다"
  - "설정 가이드는 Dialog 안 순서 목록이며 바깥에서는 알약 하나다"
  - "당사자는 로그인하지 않고 실무자가 준 링크+코드로 연다"
  - "공개 화면은 기관 내부 연결 상태나 비밀값을 말하지 않는다"

existing_dependencies:
  - "react"
  - "@playwright/test"
