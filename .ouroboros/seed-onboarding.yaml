goal: >-
  단일 기관 배포에서, 활성 관리자가 없을 때만 열리는 #/signup(기관 이름·슬러그·첫 관리자)으로 시작해
  관리자 전용 마법사(기관 정보 → 사업 1개 이상 → 실무자 초대(건너뛰기 가능) → API 연결)를 마치면
  당사자 등록으로 이어지게 하고; 관리자는 여럿일 수 있어 실무자↔관리자 역할 변경(마지막 관리자 보호)을 넣고;
  사업을 기간·설명을 가진 program_id FK 실체로 전환해 이름 변경·경고 후 종료(속한 사례는 종결·회수·배정 등 정리만)·다시 열기·
  사업별 당사자·실무자 필터를 기존 목록 위에 붙이되; 이 모두를 기존 설정 화면과 담당 배정·배정 요청에 연결하고,
  백엔드·DB부터 만들어 전체 흐름이 돌아간 뒤 UI를 정리한다.

task_type: code

project_type: brownfield

metadata:
  version: "1.0.0"
  ambiguity_score: 0.15
  interview: "Path B (no MCP) 2026-09-17, ledger local://onboarding-ledger.md, branch feat/onboarding-workspace"

constraints:
  - "테넌시: 기관 1개 유지(PLAN A3). organizations 표·org_id 를 만들지 않는다. organization 단일 행에 slug(^[a-z0-9-]+$)·onboarded_at·enc_openai_key 컬럼만 더한다. 서브도메인(기관명.relayer.kr)은 DNS·리버스 프록시 절차로 docs/deploy.md 에 적고 앱 코드는 Host 를 읽지 않는다"
  - "가입 문: POST /auth/signup {org_name, slug, email, password, name} 은 인증 미들웨어 앞(routes.ts:183 위, 초대 라우트 옆)에 둔다. 한 트랜잭션에서 organization id=1 행을 FOR UPDATE 로 잠근 뒤 활성 관리자(role='admin' and deactivated_at is null)가 0명일 때만 관리자 계정을 만들고 기관 이름·슬러그를 저장한다. Argon2 해싱은 트랜잭션 밖에서 한다(signUpWithInvite 와 같은 모양). 성공 응답은 초대 수락과 같은 모양으로 로그인 쿠키(relayer_session)를 싣는다. 활성 관리자가 있으면 403 이고 계정을 만들지 않는다. GET /auth/signup → {open:boolean} 도 인증 앞에 둔다. 감사 org.bootstrap"
  - "관리자 수를 바꾸는 모든 트랜잭션(가입·초대 수락·역할 변경·탈퇴)은 같은 organization 행 잠금을 먼저 잡아 직렬화한다. 마지막 활성 관리자는 실무자로 내리거나 탈퇴시킬 수 없다"
  - "초대 규율 유지: 기관을 만드는 첫 가입만 예외이고 그 뒤 합류는 초대 링크뿐이다. 메일 발송을 넣지 않는다(링크 수동 복사 유지). SPEC §18-3 문장을 이 예외로 고친다"
  - "마법사: #/onboarding 은 관리자 전용 단계형 화면. 순서 기관 정보(reg_no·address·phone, 이름은 가입에서 이미) → 사업 1개 이상(이름·기간·한 줄 설명) → 실무자 초대(건너뛰기 가능) → API 연결 → 완료. 완료가 POST /settings/onboarding/complete 로 onboarded_at 을 찍고 #/participants/new 로 보낸다. onboarded_at 이 비어 있는 동안 관리자는 클라이언트 리다이렉트로 마법사에 머문다(서버 잠금 없음). GET /me 에 onboarded:boolean 을 싣는다. 기존 settings 폼 컴포넌트를 재사용하고 새 스타일·토큰을 만들지 않는다"
  - "마이그레이션(0025)에서 `update organization set onboarded_at = now() where name <> ''` 로 기존 배포는 마법사를 건너뛴다. PUT /settings/org 의 name 은 min(1)"
  - "API 연결 단계: '키만 넣으면 되는 것'(OpenAI API 키 → gpt-5.5)과 '설치가 필요한 것'(STT Azure, DB)을 나눠 보여 준다. PUT /settings/ai-key {key:string|null} 은 관리자 전용, 저장 전 OpenAI GET /v1/models 로 검증해 실패하면 400 이고 저장하지 않으며, pii.ts 의 encryptPii 로 organization.enc_openai_key 에 넣고, null 이면 지운다. ai.ts 의 callOpenAi 는 호출마다 DB 키 → OPENAI_API_KEY 순으로 고르고 provider 가 openai 일 때만 DB 키를 쓴다. GET /settings/connections 의 ai 에 source:'db'|'env'|null 을 더하고 키 값은 어떤 응답·감사·로그에도 싣지 않는다. 감사 ai.key.set(fields provider=openai 또는 removed=1). STT·Supabase 키 입력 방식은 이번 범위 밖(상태·안내만)"
  - "사업 실체: programs 에 starts_on date·ends_on date·description text 를 더하고(starts_on ≤ ends_on 검사, ends_on 은 정보용), support_cases.program_id bigint FK → programs 를 더해 백필한다. 백필 규칙: programs 에 없는 program_name 은 사업으로 만들고, program_name = '' 은 '(미지정)' 사업(on conflict 로 재사용, retired_at 이 없으면 now())에 붙인다. 그 뒤 program_id NOT NULL, program_name 컬럼 제거. program_name 을 읽던 조회(settings.ts:98·148·167·358, service.ts 목록·상세, audit.ts:188·343(CSV), participant-access.ts:146, api/src/domain/briefing.ts, api/src/domain/types.ts:97, web api.ts 타입)는 join 으로 바꾸고 POST /cases 와 당사자 등록 화면(participant-new.tsx)은 program_id 를 보낸다. POST /settings/programs 도 {name, starts_on?, ends_on?, description?} 를 받는다"
  - "사업 이름 변경: PATCH /settings/programs/:id {name?, starts_on?, ends_on?, description?} 관리자 전용, id 고정. retired_at 이 있는 사업은 409 로 거절한다(종료 후 수정 불가 — 다시 열기 뒤에만). 과거 열람 기록·당사자 화면에도 새 이름이 보이는 것을 받아들인다. 감사 program.update"
  - "사업 종료: DELETE /settings/programs/:id 는 열린 사례 수·열린 사례의 예정 회차 수가 0 이 아니면 409 {open_cases, planned_sessions} 를 돌려주고 ?confirm=1 이면 retired_at 을 찍는다. 종료된 사업은 당사자 등록 선택지·기본 목록에서 빠지고 화면이 백업(scripts/backup.sh)을 권장한다. addProgram 의 on-conflict 되살리기는 없애고 이름 충돌은 409 + 다시 열기 안내"
  - "종료 잠금: access.ts 에 assertProgramActive(caseId) 를 두고 사례 생성·인테이크 저장·새 일정(planSession)·새 회차 시작(startSession 의 새 회차)·카드/기록 저장·문서 저장·동의 기록·열람 링크 발급·배정 요청에 건다. 예외: 사례 종결(closeCase), 열람 링크 회수, 관리자 배정 변경(assign), 이미 잡힌 예정 회차의 기록(recordSession·startSession 의 session_id 지정). 잠긴 쓰기는 409 이고 메시지가 사업 종료를 말한다. 닫힌 사례의 예정 회차는 일정 목록(listSchedules)에서 숨긴다"
  - "다시 열기: POST /settings/programs/:id/reopen 관리자 전용, retired_at 만 null 로 되돌린다. 종결된 사례는 되살리지 않는다. 감사 program.reopen"
  - "사업별 보기: 새 페이지를 만들지 않는다. 사업 목록에서 사업을 고르면 사업명·기간·설명·담당 실무자(그 사업의 열린 사례에 배정된 실무자, 파생)·참여 당사자 수를 보여 주고 '당사자 목록'·'실무자 목록'으로 사업 필터가 걸린 채 링크한다. GET /participants 행에 program_id 를 더하고 화면이 사업·이름·상태로 거르고 정렬한다. GET /settings/workers?program=<id> 는 그 사업의 열린 사례를 맡은 실무자만 돌려준다. program_workers 같은 명시 배정 표를 만들지 않는다"
  - "역할 변경: PUT /settings/workers/:id/role {role:'worker'|'admin'} 관리자 전용. 자기 자신을 내리는 것은 허용하되 마지막 활성 관리자는 409. 실무자 관리 › 실무자 목록에 역할 바꾸기가 선다. 감사 user.role.update(fields user=<id>, role=<new>)"
  - "seed.ts: test4 관리자를 더하고(test1·test4 관리자, test2 실무자, test3 당사자), 기관 이름·슬러그·onboarded_at 과 사업 1개를 심고 createCase 에 program_id 를 넘긴다. 가입 문 검증은 seed 없는 새 DB에서 한다"
  - "감사: AUDIT_KINDS 에 org.bootstrap·program.update·program.reopen·user.role.update·ai.key.set 을 운영 종류로 더한다. 감사 fields 에 키 값·이름 외 개인정보를 넣지 않는다"
  - "화면 범위: web/ 변경은 새 화면(#/signup, #/onboarding)과 라우터·api.ts·설정·당사자 등록 화면(participant-new.tsx)·당사자 목록·실무자 목록의 기능 배선에 한정한다. CSS·디자인 토큰·DESIGN.md·DESIGN-RULES 는 고치지 않고 .worktrees/DESIGN 의 파일을 건드리지 않는다. 화면 문구의 `기관 워크스페이스`는 한 배포의 기관 업무 환경 전체를 뜻하는 말로 쓴다 — 마법사 제목·1단계 만들기·기관 요약 카드·완료 화면(GLOSSARY §15-2, 2026-09-18 Q 확정). 홈·설정 메뉴·사이드바에는 붙이지 않는다. UI 정리는 전체 흐름이 돈 뒤 같은 브랜치의 마지막 단계다"
  - "문서: SPEC.md 에 가입 예외·마법사·API 키 저장·사업 실체(FK·기간·설명·종료 경고·잠금·다시 열기)·역할 변경을 적고, docs/deploy.md 에 기관별 서브도메인 절차와 새 DB 첫 가입 절차를 적는다. 표시명이 바뀌어도 URL·컬럼·라벨 코드는 바꾸지 않는다"
  - "비범위: 메일 발송, 멀티테넌트 org_id, 앱 내 서브도메인 라우팅, 랜딩페이지(내일, 같은 오리진에서 #/signup·로그인으로 링크), STT·Supabase 키 입력, 사업별 새 페이지, 일정 취소 API"

acceptance_criteria:
  - description: >-
      seed 없는 새 DB에서 GET /auth/signup 이 open:true 이고 POST /auth/signup 이 관리자 계정과 기관 이름·슬러그를 만들어 로그인 쿠키를 주며,
      그 뒤 GET /auth/signup 은 open:false, 두 번째 POST 는 403 으로 계정을 만들지 않고, 동시에 두 번 보내도 관리자는 한 명만 생기며,
      GET /me 가 onboarded:false 를 싣고 POST /settings/onboarding/complete 뒤 onboarded:true 가 된다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/signup.integration.test.ts --reporter=basic"
    expected_artifacts: ["api/src/routes.ts", "api/src/settings.ts", "api/test/signup.integration.test.ts", "migrations/0025_onboarding_programs.sql"]
    output_assertion: "NONE"
  - description: >-
      관리자가 실무자를 관리자로 올리고 다시 내릴 수 있고, 마지막 활성 관리자를 내리거나 탈퇴시키면 409 이며,
      역할 변경 직후 다음 요청부터 새 역할이 적용된다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/role-change.integration.test.ts --reporter=basic"
    expected_artifacts: ["api/src/settings.ts", "api/test/role-change.integration.test.ts"]
    output_assertion: "NONE"
  - description: >-
      마이그레이션 적용 뒤 support_cases 에 program_name 이 없고 program_id 가 NOT NULL 이며, 이전에 program_name 이 사업 목록에 없던 사례는
      그 이름의 사업에, 빈 이름이던 사례는 내린 '(미지정)' 사업에 붙어 있고, programs 에 starts_on·ends_on·description 이 있으며,
      기존 배포(기관 이름 있음)는 onboarded_at 이 채워지고, 미적용 마이그레이션이 없다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/migration-0025.integration.test.ts --reporter=basic && RELAYER_INTEGRATION=1 node api/src/migrate.ts --check"
    expected_artifacts: ["migrations/0025_onboarding_programs.sql", "api/test/migration-0025.integration.test.ts"]
    output_assertion: "NONE"
  - description: >-
      사업 이름을 바꿔도 그 사업의 사례가 새 이름으로 조회되고, 열린 사례·예정 회차가 있는 사업을 종료하면 409 에 건수가 실리며 confirm 으로 종료되고,
      종료된 사업의 사례에 새 일정·새 사례·인테이크·기록·문서·동의·열람 링크·배정 요청은 409 이지만 사례 종결·열람 링크 회수·관리자 배정 변경·이미 잡힌 예정 회차의 기록은 되며,
      닫힌 사례의 예정 회차가 일정 목록에서 빠지고, 종료된 사업의 이름·기간·설명 수정은 409 이며, 다시 열기 뒤 수정과 쓰기가 다시 되고, 같은 이름 재추가는 409 다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/program-lifecycle.integration.test.ts --reporter=basic"
    expected_artifacts: ["api/src/access.ts", "api/src/settings.ts", "api/src/service.ts", "api/src/routes.ts", "api/src/participant-access.ts", "api/test/program-lifecycle.integration.test.ts"]
    output_assertion: "NONE"
  - description: >-
      GET /participants 행마다 program_id 가 실리고, GET /settings/workers?program= 이 그 사업의 열린 사례를 맡은 실무자만 돌려주며,
      사례가 없는 사업은 실무자 0명이다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/program-filter.integration.test.ts --reporter=basic"
    expected_artifacts: ["api/src/service.ts", "api/src/settings.ts", "api/src/routes.ts", "api/test/program-filter.integration.test.ts"]
    output_assertion: "NONE"
  - description: >-
      PUT /settings/ai-key 가 검증에 실패한 키를 400 으로 거절해 저장하지 않고(OpenAI 호출은 fetch 스텁), 유효한 키는 암호화돼 저장되어
      GET /settings/connections 가 connected:true·source:'db' 를 보이며 어떤 응답에도 키 값이 없고, null 로 지우면 env 가 있으면 source:'env' 없으면 null 이 되며,
      실무자는 403 이다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/ai-key.integration.test.ts --reporter=basic"
    expected_artifacts: ["api/src/settings.ts", "api/src/ai.ts", "api/src/routes.ts", "api/test/ai-key.integration.test.ts"]
    output_assertion: "NONE"
  - description: >-
      새 DB(seed 없음)에서 브라우저로 #/signup → 마법사 네 단계(기관 정보·사업 추가·초대 건너뛰기·API 연결 확인) → #/participants/new 에서 당사자 등록 →
      관리자 배정 화면에서 담당 배정 → 사업 목록에서 사업을 골라 당사자·실무자 필터 링크로 이동까지 이어지고,
      마법사를 마치기 전에 다른 화면으로 가면 마법사로 돌아온다
    verify_command: "pnpm --dir web exec playwright test e2e/onboarding.spec.ts --reporter=line"
    expected_artifacts: ["web/e2e/onboarding.spec.ts", "web/src/screens/signup.tsx", "web/src/screens/onboarding.tsx", "web/src/routes.tsx", "web/src/screens/settings.tsx", "web/src/screens/participants.tsx", "web/src/screens/participant-new.tsx", "web/src/api.ts"]
    output_assertion: "NONE"
  - description: >-
      기존 단위·통합·E2E 테스트가 바뀐 계약(program_id, 마법사, seed 관리자 2명)에 맞게 고쳐져 전부 통과한다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run --reporter=basic && pnpm --dir web exec playwright test --reporter=line"
    expected_artifacts: ["api/src/seed.ts"]
    output_assertion: "NONE"
  - description: >-
      SPEC.md 가 가입 예외·마법사·API 키 저장·사업 실체·종료 잠금·다시 열기·역할 변경을 계약으로 적고, docs/deploy.md 가 서브도메인 절차와 새 DB 첫 가입 절차를 적는다
    verify_command: "grep -q 'auth/signup' SPEC.md && grep -q 'onboarded_at' SPEC.md && grep -q 'program_id' SPEC.md && grep -q 'ai-key' SPEC.md && grep -q 'reopen' SPEC.md && grep -q 'workers/:id/role' SPEC.md && grep -q '서브도메인' docs/deploy.md && grep -q 'signup' docs/deploy.md && echo SPEC_OK"
    expected_artifacts: ["SPEC.md", "docs/deploy.md"]
    output_assertion: "SPEC_OK"

ontology_schema:
  name: "RelayerOnboarding"
  description: >-
    기관 하나가 첫 관리자 가입으로 열리고 마법사를 거쳐 사업·실무자·API 연결을 갖춘 뒤 당사자 등록으로 이어지며,
    사업이 id 를 가진 실체로서 사례를 묶고 종료·다시 열기 상태를 갖는 모델.
  fields:
    - name: "organization"
      type: "object"
      description: "단일 행(id=1). name·slug·reg_no·address·phone·onboarded_at·enc_openai_key. 관리자 수 변경의 직렬화 잠금 행"
    - name: "signup_gate"
      type: "boolean"
      description: "활성 관리자(role='admin', deactivated_at is null)가 0명일 때만 true. GET /auth/signup {open}"
    - name: "user"
      type: "object"
      description: "role participant|worker|admin. 실무자↔관리자 변경 가능, 마지막 활성 관리자 보호. 로그인 아이디 불변"
    - name: "invite"
      type: "object"
      description: "관리자가 만든 7일 토큰 링크(해시 저장). 첫 가입 뒤 합류의 유일한 문. 메일 없음"
    - name: "onboarding"
      type: "object"
      description: "관리자 전용 단계 기관 정보→사업→초대(건너뛰기)→API 연결→완료. onboarded_at 이 없으면 관리자는 #/onboarding 에 머문다"
    - name: "program"
      type: "object"
      description: "id·name(unique)·starts_on·ends_on·description·retired_at. 종료는 retired_at, 다시 열기는 null 로 되돌림. 사업 담당 실무자·참여 당사자는 사례에서 파생"
    - name: "support_case"
      type: "object"
      description: "program_id FK NOT NULL. 사업이 종료되면 종결·열람 링크 회수·배정 변경·이미 잡힌 예정 회차 기록만 되고 다른 쓰기는 409"
    - name: "program_retire_warning"
      type: "object"
      description: "DELETE /settings/programs/:id 의 409 본문 {open_cases, planned_sessions}(열린 사례 기준). ?confirm=1 로 확정"
    - name: "ai_key"
      type: "object"
      description: "organization.enc_openai_key(encryptPii). 저장 전 검증, 호출마다 DB→env, connections 에 source 만 노출"
    - name: "audit_event"
      type: "object"
      description: "운영 종류 org.bootstrap·program.update·program.reopen·user.role.update·ai.key.set. 값·개인정보 없음"
    - name: "participant"
      type: "object"
      description: "기존 실체(재정의 없음). 가명·금고 PII. 사업 소속은 사례(program_id)로만 성립하고 목록 행은 사례 단위라 program_id 를 갖는다"
    - name: "session"
      type: "object"
      description: "기존 실체(재정의 없음). status planned|done. 종료된 사업에서 새 planned 는 409, 이미 잡힌 planned 의 기록은 허용, 닫힌 사례의 planned 는 일정 목록에서 숨김"
    - name: "assignment"
      type: "object"
      description: "기존 실체(재정의 없음). case_assignments·assignment_requests. 사업 담당 실무자는 이 관계에서 파생되고, 종료된 사업에서도 관리자 배정 변경은 허용·배정 요청은 409"
    - name: "case_write_paths"
      type: "object"
      description: "기존 실체(재정의 없음) — 인테이크·카드/기록·문서·동의·열람 링크(participant_access). 종료된 사업의 사례에서는 생성·발급이 409 이고 열람 링크 회수만 예외"

evaluation_principles:
  - name: "문은 하나"
    description: "기관을 여는 첫 가입만 열려 있고, 열렸는지는 활성 관리자 수 하나로 정해지며 경쟁 요청이 둘을 만들지 않는다"
    weight: 1.0
  - name: "사업은 실체"
    description: "사례는 이름이 아니라 id 로 사업에 묶이고, 이름이 바뀌어도 종료돼도 사례가 설명을 잃지 않는다"
    weight: 1.0
  - name: "종료는 잠금이지 삭제가 아니다"
    description: "종료된 사업의 사례는 정리(종결·회수·배정)만 되고 새 기록은 막히며 되돌릴 수 있다"
    weight: 1.0
  - name: "열쇠는 보이지 않는다"
    description: "키는 검증 뒤 암호화돼 저장되고 어떤 응답·감사·로그에도 값이 없다"
    weight: 1.0
  - name: "기존 위에 붙인다"
    description: "새 표·새 페이지·새 스타일 대신 기존 settings 폼·목록·API 를 넓히고 스키마 변경은 마이그레이션 하나다"
    weight: 0.9
  - name: "백엔드 먼저"
    description: "API·DB·통합 테스트가 먼저 서고, 화면은 그 계약 위에 붙으며 UI 정리는 마지막이다"
    weight: 0.8

exit_conditions:
  - name: "서버 계약 검증"
    description: "새 통합 테스트 6개와 기존 테스트가 통과한다"
    criteria: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run --reporter=basic 명령의 종료 코드가 0이다"
  - name: "마이그레이션 검사"
    description: "0025 적용 후 검사가 통과한다"
    criteria: "RELAYER_INTEGRATION=1 node api/src/migrate.ts --check 명령의 종료 코드가 0이다"
  - name: "화면 흐름 검증"
    description: "가입→마법사→당사자 등록→배정→사업별 필터 E2E 가 통과한다"
    criteria: "pnpm --dir web exec playwright test e2e/onboarding.spec.ts --reporter=line 명령의 종료 코드가 0이다"
  - name: "문서"
    description: "SPEC.md·docs/deploy.md 가 새 계약을 담는다"
    criteria: "SPEC_OK 검증 명령이 SPEC_OK 를 출력한다"

