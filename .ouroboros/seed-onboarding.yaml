existing_patterns:
  - "관리자 일은 라우트마다 adminOnly 로 다시 본다. 화면에서 감추는 것은 안내이지 잠금이 아니다"
  - "삭제 대신 시각 컬럼(retired_at·deactivated_at). 되돌림은 null 로"
  - "행 잠금 트랜잭션(FOR UPDATE) 안에서 검사와 쓰기, 해싱은 밖에서"
  - "감사에는 action·id·필드 이름만, 값·본문은 남기지 않는다"
  - "zod 로 본문 검증, ZodError → 400. 거절은 409 와 사람이 읽는 메시지"
  - "통합 테스트는 격리 DB 접두어를 강제한다"

