goal: >-
  BSS 가 Azure Container Apps(koreacentral)에 기관별 앱을 운영하는 전제에서, 기관이 만든 Supabase 와 BSS 운영자의
  명령 1개로 기관 배포(ACA 앱·Blob·관리 ID 역할·Infisical 폴더·migrate·가입 URL)가 서고, 첫 관리자는 마법사에서
  기관 소유 Azure Speech 키 붙여넣기 1회와 녹음 토글만으로 전사를 열며(검증 후 암호화 저장, 값 미노출,
  koreacentral 고정, 동의 문안은 기관명 치환), 음성·문서는 PII_ENC_KEY 로 앱 수준 암호화해 Blob 에 둔다 —
  백엔드·저장·프로비저닝·문서와 S3 UI 통합까지를 네 소유 레인으로 실행한다.

task_type: code

project_type: brownfield

metadata:
  version: "1.1.0"
  ambiguity_score: 0.15
  interview: "Path B (no MCP) 2026-09-18, ledger docs/stt-db-ledger-2026-09-18.md, ASTRA P0-1~4·P1 종결 및 current main 0af8903 재대조"

constraints:
  - "테넌시·호스팅: 기관당 배포 1개(PLAN A3, organizations/org_id 없음). BSS 가 ACA 에 기관별 컨테이너 앱 1개(min 0/max 1, targetPort 8787)를 운영한다. 기관은 서버가 없다. 맥미니·개인 PC 의 env 운영 경로를 보존할 의무는 없다"
  - "DB: 기관 소유 Supabase(서울, Pro). 기관이 BSS 를 조직 Owner 로 초대하고 BSS 운영자가 대시보드에서 비밀번호 재설정으로 세션 풀러 접속 문자열을 얻는다. 화면에서 DB 를 설정하지 않는다(db.ts:3 부팅 시 고정). 프로비저닝은 host 가 `pooler.supabase.com` 이고 포트 5432 인 문자열만 받는다 — 6543 은 '트랜잭션 풀러, 세션 풀러(5432)를 쓰세요', 직접 연결(`db.<ref>.supabase.co`)은 'IPv6 전용, 풀러 주소를 쓰세요' 로 거절한다"
  - "프로비저닝: `scripts/azure/provision-institution.sh <slug>` 하나. 기본 DRY-RUN, `APPLY=1` 로 실행(provision.sh 의 run/ensure 관례 재사용). 접속 문자열은 표준입력에서 에코 없이 읽는다(argv·로그·화면 금지). 순서: 문자열 검증(위 규칙 + `select 1`) → PII_ENC_KEY(base64 32바이트)·SESSION_SECRET 생성 → Infisical `ggbss-agent · prod · /RELAYER2/<slug>` 폴더에 DATABASE_URL·PII_ENC_KEY·SESSION_SECRET 등록(`scripts/infisical_put.py` 를 부모→자식 순 중첩 폴더 생성으로 고치고 `--skip-if-exists` 모드를 더해 이미 있는 이름은 건너뛰고 이름만 보고한다) → 리소스 그룹·스토리지 계정(`relayer2<slug>`, 공개 접근 차단, TLS1.2)·컨테이너 `voice`·`documents` → ACA 앱 `relayer2-<slug>`(시스템 할당 관리 ID, 스토리지 계정에 `Storage Blob Data Contributor` 역할, secret 은 Infisical 에서 받은 .env(0600) 파일로만 주입, env RELAYER_SLUG·RELAYER_PUBLIC_URL·BLOB_ACCOUNT·PORT) → 부팅 migrate 확인(`migrate.ts --check`) → `GET /auth/signup` 이 `open:true` → 가입 URL 출력. 이미 있는 Azure 자원은 ensure 로 건너뛰고, 이미 있는 Infisical 이름은 skip-if-exists 로 건너뛴다 — 어느 쪽도 덮지 않는다. 오류는 사전 정의 문장만 — LLM 호출 없음. 값은 어떤 출력에도 없다"
  - "시크릿 정본: Infisical 기관별 폴더가 정본, ACA secret 은 사본. PII_ENC_KEY 는 Infisical 에만 두고 손실 시 PII·저장 키·음성·문서 전부 복구 불가임을 docs/secrets.md 에 명시한다. 로테이션·재암호화·1Password 사본은 범위 밖. `ggbss-agent` 머신 ID 는 프로젝트 Admin 이라 기관 폴더는 정리 단위이지 접근 제어가 아님을 문서에 적는다"
  - "STT 키: `PUT /settings/stt-key {key:string|null}` 관리자 전용. 저장 전 `https://koreacentral.api.cognitive.microsoft.com/sts/v1.0/issueToken` 에 `Ocp-Apim-Subscription-Key` 로 검증해 200 이 아니면 400 이고 저장하지 않는다(타 리전 키는 자연히 401→400). setAiKey(settings.ts:211) 와 같은 모양으로 `organization.enc_speech_key` 에 encryptPii 로 저장, null 이면 지운다. 지역 입력은 없다 — 코드가 `koreacentral` 고정. 감사 `stt.key.set`(fields provider=azure 또는 removed=1). 키 값은 어떤 응답·감사·로그에도 없다"
  - "녹음 토글: `PUT /settings/voice {enabled:boolean}` 관리자 전용 → `organization.voice_enabled boolean null`(null 이면 env VOICE_ENABLED 폴백, 개발 편의). 감사 `voice.toggle`(fields enabled=0|1). 키 저장과 별개의 명시 토글(consent.ts:213 의도) — 키가 있어도 토글이 꺼져 있으면 녹음 없음, 토글이 켜져 있고 키가 없으면 녹음만 되고 전사는 'skipped'"
  - "게이트 비동기화: `voiceEnabled()`·`sttEnabled()` 를 DB 우선(organization.voice_enabled / enc_speech_key) → env 폴백의 async 함수로 바꾸고, `activeDomains()`·`getConsents`·`assertConsent`·`speechStatus`·`/consent-copy`·`stt.ts:139,424,489-490` 등 모든 호출처와 테스트를 async 로 옮긴다. `transcribeAudio`(stt.ts:339-341)는 env 를 직접 읽지 않고 복호한 DB 키 → env 순으로 고른다. `draftTranscript` 의 게이트를 try 안으로 옮겨 키 삭제·토글 해제 시 pending 녹음이 failed 로 정리되게 한다. 프로세스 캐시를 두지 않는다"
  - "연결 상태: `GET /settings/connections` 의 stt 는 `{connected, provider:'azure', region:'koreacentral', source:'db'|'env'|null}`, voice 는 `{enabled, source:'db'|'env'|null}` 을 더하고, db.connected 는 `select 1` 성공 여부다. 키 값·엔드포인트는 싣지 않는다"
  - "동의 문안(consent.ts CONSENT_COPY): 처리자 '사회연대은행' 을 `organization.name` 으로 치환하고 수탁자로 '사회연대은행' 을 적으며 리전은 '한국 중부(koreacentral)' 고정 문구로 둔다. canonicalPreimage 가 기관명을 포함하므로 copyHash 는 기관마다 다르고 한 배포 안에서는 고정이다. COPY_VERSION 을 v4 로 올린다. 기관명 치환으로 현재 동의 전부가 '확인 필요' 로 떨어진다. 실제 사용 전 이 경로와 관리자 화면의 기존 경고(이메일 등 정해진 방식으로 고지 후 재동의)를 확인하고, 기관명 변경도 재동의 사유로 문서화한다. `/consent-copy` 는 치환된 문안을 낸다"
  - "Blob 저장: `api/src/storage.ts` 에 `put(container, relPath, bytes)`·`get`·`del`·`exists` 를 가진 백엔드 1개 인터페이스와 구현 둘 — 파일시스템(VOICE_ROOT/DOC_ROOT, 로컬 개발·테스트) 과 Azure Blob(`@azure/storage-blob` + `@azure/identity` DefaultAzureCredential, env BLOB_ACCOUNT 가 있으면 선택). 바이트는 저장 전 PII_ENC_KEY 로 AES-256-GCM 암호화(pii.ts 의 encryptPii 와 같은 키·같은 방식, 바이너리용 함수 추가)하고 읽을 때 복호한다. stt.ts 의 saveRecording·readRecordingAudio·draftTranscript·sweepExpiredRecordings 와 documents.ts 의 saveDocument·readDocument·sweepExpiredDocuments 가 fs 를 직접 부르지 않고 이 백엔드를 쓴다. recordings.sha256·bytes 는 평문 기준 그대로. 파일시스템 모드의 0700/0600 은 유지"
  - "마이그레이션 `0029_stt_key_voice.sql`: organization 에 enc_speech_key text, voice_enabled boolean(null 허용) 추가. `0027_ui_plan_api.sql` 과 `0028_onboarding_step.sql` 은 main 에 이미 있으므로 건드리지 않는다"
  - "감사: AUDIT_KINDS 에 stt.key.set·voice.toggle 을 운영 종류로 등록한다. 미등록 action 은 버려진다(audit.ts:82-85)"
  - "스크립트 정리: `infisical_get.py` 는 폴더 경로를 인자로 받고 WANT/OPTIONAL 에서 AZURE_SPEECH_KEY·AZURE_SPEECH_REGION·AZURE_SPEECH_ENDPOINT·VOICE_ENABLED 를 뺀다. `check-case-access.mjs` 의 DOCUMENT_ROOT 를 DOC_ROOT 로 고친다(기존 버그). `scripts/azure/provision.sh` 는 provision-institution.sh 로 대체하고 지운다"
  - "문서: docs/azure-migration.md 를 결정 반영으로 다시 쓴다(기관별 앱·관리 ID·Blob 컨테이너 둘·PII_ENC_KEY 재사용·Key Vault 없음). docs/institution-setup.md 를 '기관이 하는 일 = Supabase 프로젝트 만들기 + BSS 초대 + Azure Speech 리소스 만들기 + 관리자 마법사에서 키 붙여넣기' 로 다시 쓰고 Infisical·pull-secrets 문단을 BSS 운영자 절(docs/deploy.md)로 옮긴다. docs/secrets.md 에 기관별 폴더·PII_ENC_KEY 손실 태도·접근 제어 아님을 적는다. SPEC.md §음성 업로드와 비교 의 986·994-995 를 Blob·앱 수준 암호화·DB 키·토글로 고치고 §18 설정하기에 stt-key·voice 계약을 적는다. GLOSSARY 는 바꾸지 않는다"
  - "레인 경계: S1 은 routes/settings/consent/service, S2b 는 storage/pii/stt/documents, S2 는 scripts/azure 와 Infisical, S3 는 web/src/api.ts·ui.tsx 지정 부품·dialog.tsx·ConsentDetail 소비 화면·온보딩·설정·랜딩을 소유한다. `web/src/styles/app.css` 는 S3 만 수정한다. 소비 props/API 서명은 `HANDOFF-STT.md` 를 먼저 따른다"
  - "UI 계획 선행 사실: main 의 `0027_ui_plan_api.sql` 은 구조화 인테이크 detail_json 을 텍스트 revision 범위 밖에 두고 기존 편집 경로를 유지하며, duration_min 을 일정 생성·기록 수정·사례/회차 조회에 연결하고, summary revision 은 승인 ai_drafts 새 행을 쌓으며, cases next-goals 는 updateNextGoal 을 재사용해 기록 전·이미 이어받은 목표를 모두 거절한다"
  - "실측: align-check 는 중심 x·y·xy 만 사용한다. right·width·top 은 x/y 로 가장하지 않고 카드별 선택자 안에서 Playwright boundingBox/getBoundingClientRect 로 별도 비교한다. measure-cards 는 측정 중 height:auto 로 바꾸므로 실제 등높이 카드의 늘어난 아래 여백을 증명하지 않는다"
  - "순서: 계약·정본 → 통합본 검증(일회용 DB, tsc/build·measure·e2e --workers=1·migrate --check·align 및 bounding-box) → 배포 → 운영 스모크. 공유 DB relayer·운영 Supabase·운영 체크아웃은 검증에 쓰지 않는다"
  - "이력: #61·#63 은 닫음, #62(e4735bd)·#64(ae88395)는 머지, #65 checkpoint c4acb52 는 새 managed identity·BLOB_ACCOUNT·직접 PII_ENC_KEY 계약으로 고친 뒤 선별 재사용만 허용한다"
  - "비범위: STT 제공자 변경, DB 화면 설정, 멀티테넌트, 메일, PII_ENC_KEY 로테이션, 1Password 이전, ACR 선택, Cloudflare 터널 전환 절차(런북에 남김), LLM 오류 해석, 문서 Azure Files, 맥미니 파일 이전 스크립트(실데이터 없음 — azure-migration.md 의 이전 절도 지운다)"

acceptance_criteria:
  - description: >-
      관리자가 STT 키를 넣으면 issueToken 검증(fetch 스텁)에 실패한 키는 400 으로 저장되지 않고, 유효한 키는 암호화돼 저장되어
      GET /settings/connections 가 stt.connected:true·source:'db'·region:'koreacentral' 을 보이며, null 로 지우면 env 가 있으면 'env' 없으면 null 이고,
      같은 응답의 voice 가 {enabled, source:'db'|'env'|null} 로 토글 상태를 보이고 db.connected 가 select 1 실패 시 false 이며,
      실무자는 403 이며, 어떤 응답·감사 행에도 키 값이 없다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/stt-key.integration.test.ts --reporter=basic"
    expected_artifacts: ["api/src/settings.ts", "api/src/routes.ts", "migrations/0029_stt_key_voice.sql", "api/test/stt-key.integration.test.ts"]
    output_assertion: "NONE"
  - description: >-
      관리자가 녹음 토글을 켜면 /consent-copy 와 getConsents 에 음성 영역 3종이 나타나고 끄면 사라지며, 토글이 켜져 있고 키가 없으면 업로드는 되고
      전사는 'skipped' 로 남고, 키가 있는 상태에서 키를 지우면 전사 중이던 녹음이 failed 로 정리되고, voice_enabled 가 null 이면 env VOICE_ENABLED 를 따른다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/voice-toggle.integration.test.ts --reporter=basic"
    expected_artifacts: ["api/src/consent.ts", "api/src/stt.ts", "api/src/service.ts", "api/test/voice-toggle.integration.test.ts"]
    output_assertion: "NONE"
  - description: >-
      동의 문안이 organization.name 을 처리자로 담고 수탁자 사회연대은행·한국 중부 문구를 가지며, 기관명이 다르면 copyHash 가 다르고 같은 배포에서는 고정이고,
      COPY_VERSION 이 v4 이며 전환 뒤 현재 동의 전부가 '확인 필요' 로 떨어지고 관리자 화면의 고지·재동의 경고가 유지된다
    verify_command: "pnpm --dir api exec vitest run test/consent-copy.test.ts --reporter=basic"
    expected_artifacts: ["api/src/consent.ts", "api/test/consent-copy.test.ts"]
    output_assertion: "NONE"
  - description: >-
      저장 백엔드가 파일시스템·Blob(스텁) 어느 쪽이든 녹음·문서를 PII_ENC_KEY 로 암호화해 두고 복호해 돌려주며, 저장된 바이트는 평문과 다르고 sha256 은 평문 기준이고,
      보유기간 스윕이 두 백엔드에서 만료 파일을 지우고 없는 파일을 missing 으로 세며, 기존 음성 테스트와 새 문서 경로 회귀 테스트가 통과한다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/storage.integration.test.ts test/voice.test.ts test/documents.integration.test.ts --reporter=basic"
    expected_artifacts: ["api/src/storage.ts", "api/src/stt.ts", "api/src/documents.ts", "api/src/pii.ts", "api/test/storage.integration.test.ts", "api/test/documents.integration.test.ts"]
    output_assertion: "NONE"
  - description: >-
      provision-institution.sh 가 DRY-RUN 에서 6543·직접 연결 문자열을 정의된 문장으로 거절하고, 세션 풀러 문자열에는 Infisical 폴더·스토리지·컨테이너 둘·ACA 앱·역할 부여·
      migrate 검사·signup 확인·가입 URL 순서의 명령을 출력하며, 출력 어디에도 입력한 문자열이 없다
    verify_command: "bash scripts/azure/provision-institution.test.sh"
    expected_artifacts: ["scripts/azure/provision-institution.sh", "scripts/azure/provision-institution.test.sh", "scripts/infisical_put.py", "scripts/infisical_get.py"]
    output_assertion: "PROVISION_OK"
  - description: >-
      전체 단위·통합 테스트 스위트가 새 계약(async 게이트, 저장 백엔드, 문안 v4) 아래 통과하고 미적용 마이그레이션이 없다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run --reporter=basic && RELAYER_INTEGRATION=1 node api/src/migrate.ts --check"
    expected_artifacts: ["api/src/index.ts", "scripts/check-case-access.mjs"]
    output_assertion: "NONE"
  - description: >-
      SPEC.md 가 stt-key·voice 계약·Blob 앱 수준 암호화·DB 키 게이트를 적고, docs/azure-migration.md·institution-setup.md·secrets.md·deploy.md 가 기관별 앱·관리 ID·
      기관 Supabase 인수·PII_ENC_KEY 손실 태도를 적으며, S3 UI 인계 문서가 API·공용 props 계약을 담는다
    verify_command: "grep -q 'settings/stt-key' SPEC.md && grep -q 'settings/voice' SPEC.md && grep -q 'enc_speech_key' SPEC.md && grep -q '관리 ID' docs/azure-migration.md && grep -q 'Owner' docs/institution-setup.md && grep -q '복구 불가' docs/secrets.md && grep -q 'provision-institution' docs/deploy.md && grep -q 'stt-key' HANDOFF-STT.md && echo SPEC_OK"
    expected_artifacts: ["SPEC.md", "docs/azure-migration.md", "docs/institution-setup.md", "docs/secrets.md", "docs/deploy.md", "HANDOFF-STT.md"]
    output_assertion: "SPEC_OK"

ontology_schema:
  name: "RelayerInstitutionCloud"
  description: >-
    BSS 가 기관마다 하나씩 띄우는 앱이 기관 소유 Supabase·Azure Speech 와 BSS 소유 Blob 에 붙고, 관리자는 키 하나와 토글 하나로 전사를 열며,
    파일은 앱이 암호화해 Blob 에 두는 모델.
  fields:
    - name: "institution_deployment"
      type: "object"
      description: "slug 로 식별되는 ACA 앱 1개 + 스토리지 계정 1개 + Infisical 폴더 /RELAYER2/<slug>. provision-institution.sh 가 만들고 덮지 않는다"
    - name: "database_url"
      type: "string"
      description: "기관 소유 Supabase 세션 풀러(pooler.supabase.com:5432) 문자열. BSS 운영자가 Owner 권한으로 비밀번호 재설정해 얻고 stdin 으로만 스크립트에 넘긴다. 앱은 부팅 시 읽는다"
    - name: "session_secret"
      type: "string"
      description: "로그인 쿠키 서명 열쇠. 프로비저닝이 생성해 Infisical 기관 폴더에 등록하고 ACA secret 으로 주입한다. 값은 어떤 출력에도 없다"
    - name: "pii_enc_key"
      type: "string"
      description: "base64 32바이트. 프로비저닝이 생성해 Infisical 에만 둔다. PII·OpenAI 키·Speech 키·음성·문서 암호화에 모두 쓴다. 손실=복구 불가"
    - name: "speech_key"
      type: "object"
      description: "organization.enc_speech_key(encryptPii). koreacentral issueToken 검증 뒤 저장. 호출마다 DB→env. 값은 어떤 출력에도 없다"
    - name: "voice_switch"
      type: "boolean"
      description: "organization.voice_enabled(null 허용). 녹음 허용 여부. 키와 별개. null→env VOICE_ENABLED"
    - name: "feature_gate"
      type: "object"
      description: "voiceEnabled()/sttEnabled() async. voice=토글, stt=토글∧키. activeDomains·동의 게이트·speechStatus·transcribe 가 이것을 본다"
    - name: "consent_copy"
      type: "object"
      description: "처리자=organization.name, 수탁자=사회연대은행, 리전=한국 중부 고정. copyHash 는 배포마다 다르고 안에서는 고정. COPY_VERSION v4"
    - name: "storage_backend"
      type: "object"
      description: "put/get/del/exists 인터페이스. fs(VOICE_ROOT/DOC_ROOT) 또는 blob(BLOB_ACCOUNT, DefaultAzureCredential). 바이트는 PII_ENC_KEY AES-256-GCM 으로 감싸서 저장"
    - name: "recording"
      type: "object"
      description: "기존 실체. rel_path·bytes·sha256 은 평문 기준. 저장·읽기·전사·스윕이 storage_backend 를 통한다"
    - name: "document"
      type: "object"
      description: "기존 실체. recording 과 같은 규칙으로 documents 컨테이너에"
    - name: "connections_status"
      type: "object"
      description: "GET /settings/connections. ai/stt/voice/db. source db|env|null. db.connected 는 select 1"
    - name: "audit_event"
      type: "object"
      description: "운영 종류 stt.key.set·voice.toggle 추가. 값 없음"
    - name: "ui_handoff"
      type: "object"
      description: "HANDOFF-STT.md — S3 가 온보딩·설정·랜딩에 붙일 공용 props와 stt-key·voice·connections 계약"

evaluation_principles:
  - name: "관리자 액션은 둘"
    description: "키 붙여넣기 1회와 토글 1회 외에 관리자가 할 일이 없고, 지역·엔드포인트·env 를 알 필요가 없다"
    weight: 1.0
  - name: "운영자 액션은 하나"
    description: "명령 1개와 문자열 1개로 기관 배포가 서고, 값이 argv·로그·화면 어디에도 남지 않는다"
    weight: 1.0
  - name: "열쇠는 보이지 않는다"
    description: "Speech 키·DB 문자열·PII_ENC_KEY 가 어떤 응답·감사·로그·출력에도 없다"
    weight: 1.0
  - name: "파일은 앱이 잠근다"
    description: "Blob 에는 암호문만 있고 fs 백엔드에서도 같은 코드 경로가 돈다"
    weight: 1.0
  - name: "게이트는 한 곳"
    description: "voice/stt 판정은 async 두 함수뿐이고 env 직접 읽기·캐시가 없다"
    weight: 0.9
  - name: "기존 위에 붙인다"
    description: "setAiKey 모양·provision.sh 관례·infisical_put 재사용, 새 표 없음, 마이그레이션 하나"
    weight: 0.9
  - name: "정본은 하나"
    description: "azure-migration.md·institution-setup.md·secrets.md·SPEC 이 서로 다른 방향을 말하지 않는다"
    weight: 0.8

exit_conditions:
  - name: "서버 계약 검증"
    description: "새 통합 테스트 4개와 기존 테스트가 통과한다"
    criteria: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run --reporter=basic 명령의 종료 코드가 0이다"
  - name: "마이그레이션 검사"
    description: "0029 적용 후 검사가 통과한다"
    criteria: "RELAYER_INTEGRATION=1 node api/src/migrate.ts --check 명령의 종료 코드가 0이다"
  - name: "프로비저닝 검증"
    description: "DRY-RUN 셀프테스트가 통과한다"
    criteria: "bash scripts/azure/provision-institution.test.sh 가 PROVISION_OK 를 출력한다"
  - name: "문서"
    description: "SPEC·docs·인계 문서가 새 계약을 담는다"
    criteria: "SPEC_OK 검증 명령이 SPEC_OK 를 출력한다"

