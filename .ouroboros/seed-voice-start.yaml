goal: >-
  상담은 수기든 녹음이든 시작하는 순간 회차가 되고 부족한 정보는 나중에 채운다.
  녹음은 업로드 즉시 응답하고 뒤에서 Azure 전사가 돌아 그 회차에 붙으며,
  당사자 정보의 회차별 요약이 수기 미작성·녹음·전사 상태를 알 수 있어 수기·음성 전문으로 오갈 수 있다.
  루트 레인은 API·데이터·문서를, DESIGN 레인(.worktrees/DESIGN, design/voice-start-ui)은 화면
  (상단 녹음 버튼·전문 보기·요약↔전문 링크)을 같은 인계 문서를 계약 삼아 나란히 구현한다.

task_type: code

project_type: brownfield

metadata:
  version: "1.0.0"
  ambiguity_score: 0.15
  interview: "Path B (no MCP) 2026-09-16, ledger local://interview-ledger.md"

constraints:
  - "레인 경계: 루트 워크트리(feat/voice-start-server)는 api/**·migrations/**·SPEC.md·docs/** 만 고친다. 화면·CSS·문구·DESIGN.md·web/** 은 .worktrees/DESIGN 워크트리의 design/voice-start-ui 브랜치에서만 고친다. 두 레인은 서로의 워크트리에서 switch·reset·stash·clean·파일 삭제를 하지 않는다"
  - "회차 소유 유지: recordings·transcripts 는 지금처럼 session_id 로 회차에 붙는다. case_id 추가·nullable 전환·미연결 녹음 목록 API 를 만들지 않는다"
  - "시작 경로: POST /cases/:id/sessions/start 가 회차 하나를 status done·held_at now·memo 없음으로 만들어 id·seq 를 돌려준다. 화면은 수기 첫 입력이든 녹음 시작이든 이 경로를 먼저 부른 뒤 그 회차에 업로드·저장한다. 본문 { session_id? } 로 예정 회차를 지정하면 그 planned 회차를 done 으로 바꾸고, 없으면 새 회차를 만든다. 지정한 회차가 그 사례 것이 아니거나 이미 done 이면 409"
  - "회차 생성 계약: 회차를 기록됨(done)으로 저장할 때 상담 내용(memo)은 선택이다. memo 가 비어도 회차 번호·회차 수·15초 다시보기에 포함되는 정식 회차다. sessions.status 에 새 값을 추가하지 않는다"
  - "append-only 유지: transcripts 는 UPDATE·DELETE 금지 트리거를 그대로 둔다. 전사 진행 상태(대기·완료·실패·건너뜀)는 recordings 행의 컬럼으로 두고, 전사 결과는 지금처럼 transcripts 행을 새로 쌓는다"
  - "백그라운드 실행 방식: 업로드 응답 뒤 같은 프로세스 안에서 전사를 이어 돌린다. 잡 큐·워커·외부 스케줄러를 만들지 않는다. 프로세스가 재시작되면 '대기' 상태였던 녹음은 '실패'로 바꾸고 수동 재시도(POST /recordings/:id/transcript)로 다시 돌린다"
  - "동의 게이트 유지: 외부 STT 동의가 없으면 자동 전사를 건너뛰고 '건너뜀(동의 없음)' 상태를 남긴다. 상담 녹음 동의가 없으면 업로드 자체를 지금처럼 409 로 막는다. STT 제공자는 azure 하나다(SPEC §16)"
  - "동의 철회 부수효과: 어느 사례에서 상담 녹음 또는 음성 원본 보유기간 동의가 withdraw 로 기록되면 **그 사례**의 회차에 붙은 녹음 파일을 즉시 지우고 deleted_at 을 찍는다. 다른 사례의 녹음은 건드리지 않는다(SPEC §944 사례 단위 동의 범위). 전사문(글)은 지우지 않는다 — 동의 문안이 약속한 것은 음성 원본 삭제다"
  - "종결 사례 경계: support_cases.status = closed 인 사례의 회차에는 녹음 업로드·전사 요청을 409 로 거절한다. 이미 붙은 녹음의 재생·전사문 열람은 그대로 둔다"
  - "업로드 상한: SPEECH_MAX_BYTES 를 200MiB 로 올린다(Azure Fast Transcription 한도 300MB·2시간 안). 라우트의 content-length 검사·저장·재생·전사의 상한이 모두 같은 상수를 쓴다. 공개 경로(Tailscale Funnel·cloudflared)의 본문 한도를 확인해 docs/deploy.md 에 한 줄로 기록한다"
  - "회차 상태 노출: GET /cases/:id 의 sessions[] 각 항목에 written(수기 있음 여부)과 voice { recordings: 수, transcript: none|pending|draft|approved|failed|skipped } 를 planned·done 구분 없이 싣는다. 기존 필드는 바꾸지 않는다(추가만)"
  - "전사 초안 노출: 전사 초안(draft)은 승인 전에도 GET /sessions/:id/transcript 로 읽힌다(지금과 같음). 승인 게이트는 불일치 비교·기록 반영에만 남는다"
  - "감사: 자동 전사도 voice.transcribe 로 남기고, 철회 삭제는 voice.sweep 과 구분되는 라벨(voice.withdraw)로 남긴다. 보낸 음성·전사 원문은 감사에 남기지 않는다"
  - "개인정보: 전사문·상담 내용은 지금처럼 암호화 저장하고 로그·오류 메시지에 본문을 쓰지 않는다. 실제 사용자의 녹음을 시험 데이터로 보내지 않는다"
  - "비범위: AI 영역별 입력 설계(Q1~Q3 답은 원장에 보관, 다음 브랜치), 실시간 스트리밍 전사, 화자 분리, 전사문 → 수기 기록 자동 반영, 분할·재개 업로드, ccc-preview·운영 배포"
  - "이름: GLOSSARY.md 가 정본이다. 표시명이 바뀌어도 URL·컬럼·라벨 코드는 바꾸지 않는다"

acceptance_criteria:
  - description: >-
      녹음 업로드 응답이 전사 결과를 기다리지 않고 돌아오고, 이후 조회에서 같은 녹음의 transcribe_state 가
      pending → done(전사 초안 transcript 생성) 또는 failed(Azure 오류)로 바뀌며, 외부 STT 동의가 없으면 skipped 로 남고,
      프로세스 재시작 시 pending 이던 녹음은 failed 가 되며, 어느 경우든 수동 전사 요청으로 다시 돌릴 수 있고,
      50MiB 초과 200MiB 이하 녹음이 받아진다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/voice-auto.integration.test.ts --reporter=basic"
    expected_artifacts: ["api/src/stt.ts", "api/src/index.ts", "api/test/voice-auto.integration.test.ts"]
    output_assertion: "NONE"
  - description: >-
      시작 경로 한 번으로 상담 내용 없는 기록 회차가 생기고(예정 회차에서 시작하면 그 회차가 기록됨이 되고),
      사례 상세의 sessions[] 에서 그 회차가 written=false 와 voice 상태(녹음 수·전사 상태)를 갖고 회차 번호에 포함되며,
      상담 내용 없이 저장해도 15초 다시보기와 회차 한 줄이 오류 없이 조립된다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/session-start.integration.test.ts --reporter=basic"
    expected_artifacts: ["api/src/service.ts", "api/src/routes.ts", "api/test/session-start.integration.test.ts"]
    output_assertion: "NONE"
  - description: >-
      한 사례에서 상담 녹음 또는 음성 원본 보유기간 동의를 철회하면 그 사례 회차의 녹음 파일이 디스크에서 사라지고
      deleted_at 이 찍히며 재생 요청이 거절되고, 같은 당사자의 다른 사례 녹음과 전사문은 남으며, 감사에 voice.withdraw 가 남는다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/voice-withdraw.integration.test.ts --reporter=basic"
    expected_artifacts: ["api/src/service.ts", "api/test/voice-withdraw.integration.test.ts"]
    output_assertion: "NONE"
  - description: >-
      종결된 사례의 회차에 녹음 업로드와 전사 요청을 보내면 409 를 받고, 기존 녹음 재생과 전사문 조회는 계속 된다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/voice-closed-case.integration.test.ts --reporter=basic"
    expected_artifacts: ["api/src/routes.ts", "api/test/voice-closed-case.integration.test.ts"]
    output_assertion: "NONE"
  - description: >-
      음성 상태 API(max_bytes)가 200MiB 를 보고하고, 그보다 큰 content-length 는 DB 없이도 거절된다
    verify_command: "pnpm --dir api exec vitest run test/voice.test.ts --reporter=basic"
    expected_artifacts: ["api/src/stt.ts", "api/test/voice.test.ts"]
    output_assertion: "NONE"
  - description: >-
      마이그레이션 적용 뒤 recordings 에 transcribe_state 컬럼이 있고 기존 행이 전사문 유무에 따라 done 또는
      none 상당의 값으로 채워져 있으며, 미적용 마이그레이션이 없다
    verify_command: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run test/migration-0023.integration.test.ts --reporter=basic && RELAYER_INTEGRATION=1 node api/src/migrate.ts --check"
    expected_artifacts: ["migrations/0023_recording_transcribe_state.sql", "api/test/migration-0023.integration.test.ts"]
    output_assertion: "NONE"
  - description: >-
      DESIGN 레인 인계 문서가 상단 녹음 버튼(브라우저 MediaRecorder + 파일 올리기, 시작 경로를 먼저 부름,
      Windows·Mac·iPhone·Android 브라우저 형식), 수기·음성 전문 보기 화면(수기 저장본 전체·전사문 초안/확인 표시·재생),
      회차별 요약의 수기 미작성·전사 상태 표시와 전문 링크, 바뀐 API 계약(sessions/start, sessions[].written·voice, max_bytes)을 담는다
    verify_command: "grep -q 'MediaRecorder' docs/handoff-voice-ui-2026-09-16.md && grep -q 'sessions/start' docs/handoff-voice-ui-2026-09-16.md && grep -q '수기 미작성' docs/handoff-voice-ui-2026-09-16.md && grep -q 'written' docs/handoff-voice-ui-2026-09-16.md && grep -q 'iPhone' docs/handoff-voice-ui-2026-09-16.md && grep -q '초안' docs/handoff-voice-ui-2026-09-16.md && grep -q '재생' docs/handoff-voice-ui-2026-09-16.md && echo HANDOFF_OK"
    expected_artifacts: ["docs/handoff-voice-ui-2026-09-16.md"]
    output_assertion: "HANDOFF_OK"
  - description: >-
      상담 기록하기 상단에서 녹음을 시작하면(가짜 마이크) 즉시 회차가 생기고 멈추면 녹음이 그 회차에 붙으며,
      당사자 정보의 회차별 요약에 그 회차가 수기 미작성·전사 상태와 함께 나오고 전문 보기로 열면
      수기 저장본과 전사문(초안이면 확인 전 표시)·재생이 보이고 다시 요약으로 돌아온다
    verify_command: "pnpm --dir web exec playwright test e2e/voice-start.spec.ts --reporter=line"
    expected_artifacts: ["web/e2e/voice-start.spec.ts", "web/src/screens/record.tsx", "web/src/screens/participant-info.tsx"]
    output_assertion: "NONE"
  - description: >-
      SPEC.md 가 시작 경로·상담 내용 선택·자동 전사와 상태·철회 삭제·종결 거절·200MiB 상한을 계약으로 적고,
      docs/deploy.md 가 공개 경로의 본문 한도를 기록한다
    verify_command: "grep -q '자동 전사' SPEC.md && grep -q '200MiB' SPEC.md && grep -q 'voice.withdraw' SPEC.md && grep -q 'sessions/start' SPEC.md && grep -q '본문 한도' docs/deploy.md && echo SPEC_OK"
    expected_artifacts: ["SPEC.md", "docs/deploy.md"]
    output_assertion: "SPEC_OK"

ontology_schema:
  name: "RelayerVoiceSession"
  description: >-
    시작하면 곧 회차가 되고, 녹음이 회차에 붙어 뒤에서 전사되며, 회차별 요약이 수기·음성 상태를 드러내는 모델.
    전사 결과는 append-only 로 쌓이고 진행 상태는 녹음 행이 갖는다.
  fields:
    - name: "session"
      type: "object"
      description: "회차. status planned(일정)·done(기록됨). 시작 경로(POST /cases/:id/sessions/start)로 memo 없이 done 으로 생기며, 그때 memo 는 비어 있을 수 있다(수기 미작성)"
    - name: "recording"
      type: "object"
      description: "회차에 붙은 음성 원본. 기관 디스크 VOICE_ROOT. transcribe_state(pending|done|failed|skipped)와 사유를 갖는다. 200MiB 이하"
    - name: "transcript"
      type: "object"
      description: "녹음의 전사문. draft·approved 를 append-only 로 쌓는다. 초안도 조회된다"
    - name: "consent_event"
      type: "object"
      description: "동의 사건. counseling_recording·voice_original_retention_period 의 withdraw 는 녹음 파일 즉시 삭제를 일으킨다"
    - name: "support_case"
      type: "object"
      description: "사례. status open|closed. closed 면 새 녹음·전사를 받지 않는다. 동의 사건과 회차의 범위 단위"
    - name: "audit_event"
      type: "object"
      description: "감사 사건. voice.record·voice.transcribe(자동 포함)·voice.approve·voice.sweep·voice.withdraw 라벨과 case_id. 본문은 담지 않는다"
    - name: "session_voice_state"
      type: "object"
      description: "사례 상세 sessions[] 항목의 파생 상태. written(boolean)·voice.recordings(number)·voice.transcript(none|pending|draft|approved|failed|skipped)"
    - name: "handoff_doc"
      type: "string"
      description: "DESIGN 레인이 화면을 만들 때 읽는 인계 문서. docs/handoff-voice-ui-2026-09-16.md"

evaluation_principles:
  - name: "시작이 곧 회차"
    description: "수기든 녹음이든 시작한 상담은 정보가 비어도 회차로 존재하고 나중에 채울 수 있다"
    weight: 1.0
  - name: "기다리지 않는다"
    description: "업로드는 즉시 끝나고 전사는 뒤에서 돌며, 실패·건너뜀이 상태로 보이고 다시 시도할 수 있다"
    weight: 1.0
  - name: "동의가 문이다"
    description: "동의 없이는 보내지 않고, 철회하면 약속한 대로 음성 원본을 바로 지운다"
    weight: 1.0
  - name: "최소 변경"
    description: "소유권·스키마·상태값을 늘리지 않고 큐·워커를 만들지 않는다"
    weight: 0.9
  - name: "레인 경계"
    description: "루트는 api·migrations·문서만, DESIGN 워크트리는 web 만 고치며 인계 문서가 둘의 계약이다"
    weight: 1.0

exit_conditions:
  - name: "서버 계약 검증"
    description: "단위·통합 테스트가 통과한다"
    criteria: "RELAYER_INTEGRATION=1 pnpm --dir api exec vitest run --reporter=basic 명령의 종료 코드가 0이다"
  - name: "마이그레이션 검사"
    description: "0023 적용 후 검사가 통과한다"
    criteria: "RELAYER_INTEGRATION=1 node api/src/migrate.ts --check 명령의 종료 코드가 0이다"
  - name: "인계와 계약 문서"
    description: "DESIGN 인계 문서와 SPEC.md 갱신이 존재한다"
    criteria: "docs/handoff-voice-ui-2026-09-16.md 가 있고 SPEC.md 가 새 계약을 담는다"
  - name: "화면 흐름 검증"
    description: "DESIGN 레인의 녹음 시작 → 회차별 요약 → 전문 보기 E2E 가 루트 서버에 붙어 통과한다"
    criteria: "pnpm --dir web exec playwright test e2e/voice-start.spec.ts --reporter=line 명령의 종료 코드가 0이다"

context_references:
  - path: "SPEC.md"
    role: "primary"
    summary: "§16 음성 흐름(녹음 동의 → 녹음 → STT 동의 → 전사 → 사람이 확인), §22 업로드 계약(50MiB, Azure Fast Transcription)"
  - path: "api/src/stt.ts"
    role: "primary"
    summary: "saveRecording·draftTranscript·approveTranscript·sweep. SPEECH_MAX_BYTES. session_id 기준"
  - path: "api/src/service.ts"
    role: "primary"
    summary: "recordSession(memo 필수 현재)·getCaseDetail(sessions[])·recordConsent(부수효과 없음)·closeCase·getMismatches"
  - path: "api/src/routes.ts"
    role: "primary"
    summary: "PATCH /sessions/:id(memo 필수 zod), POST /sessions/:id/recordings, /recordings/:id/transcript, /consent-copy"
  - path: "api/src/consent.ts"
    role: "primary"
    summary: "동의 영역 6개·문안·assertConsent·voiceEnabled·sttEnabled"
  - path: "api/src/audit.ts"
    role: "reference"
    summary: "AUDIT_KINDS voice.record/transcribe/approve/sweep"
  - path: "migrations/0012_recordings.sql"
    role: "primary"
    summary: "recordings·transcripts 스키마, transcripts append-only 트리거"
